version: '3.8'

networks:
  tuttime-net:

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: tuttime
      POSTGRES_USER: tuttime
      POSTGRES_PASSWORD: ***REMOVED***
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  eureka-server:
    image: steeltoeoss/eureka-server:latest
    ports:
      - "8761:8761"

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - restaurant-service
      - menu-service
      - booking-service
      - auth-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - tuttime-net

  restaurant-service:
    build: ./restaurant-service
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - redis
      - eureka-server
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tuttime
      - SPRING_REDIS_HOST=redis
    networks:
      - tuttime-net

  menu-service:
    build: ./menu-service
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - eureka-server
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tuttime
    networks:
      - tuttime-net

  booking-service:
    build: ./booking-service
    ports:
      - "8083:8083"
    depends_on:
      - postgres
      - redis
      - kafka
      - eureka-server
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tuttime
      - SPRING_REDIS_HOST=redis
    networks:
      - tuttime-net

  auth-service:
    build: ./auth-service
    ports:
      - "8084:8084"
    depends_on:
      - postgres
      - eureka-server
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tuttime
    networks:
      - tuttime-net

  order-service:
    build: ./order-service
    ports:
      - "8085:8085"
    depends_on:
      - postgres
      - redis
      - eureka-server
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tuttime
      - SPRING_REDIS_HOST=redis
    networks:
      - tuttime-net

  payment-service:
    build: ./payment-service
    ports:
      - "8086:8086"
    depends_on:
      - postgres
      - eureka-server
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tuttime
    networks:
      - tuttime-net

  integration-service:
    build: ./integration-service
    ports:
      - "8087:8087"
    depends_on:
      - postgres
      - kafka
      - eureka-server
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tuttime
    networks:
      - tuttime-net

  review-service:
    build: ./review-service
    ports:
      - "8088:8088"
    depends_on:
      - postgres
      - eureka-server
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tuttime
    networks:
      - tuttime-net

  analytics-service:
    build: ./analytics-service
    ports:
      - "8089:8089"
    depends_on:
      - postgres
      - kafka
      - eureka-server
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tuttime
    networks:
      - tuttime-net

volumes:
  postgres_data:
