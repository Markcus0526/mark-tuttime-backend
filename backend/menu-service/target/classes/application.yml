server:
  port: 8082

spring:
  application:
    name: menu-service
  datasource:
    url: jdbc:postgresql://localhost:5432/tuttime
    username: tuttime
    password: ***REMOVED***
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  redis:
    host: localhost
    port: 6379
  kafka:
    bootstrap-servers: localhost:9092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.tuttime: DEBUG
