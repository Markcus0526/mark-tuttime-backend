services:
  # ============================================================================
  # Infrastructure Services
  # ============================================================================

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tuttime-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ""
    command: >
      sh -c "
      if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\"
      else
        redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
      fi
      "
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tuttime-network

  # Kafka 4.0 - KRaft mode
  kafka:
    image: docker.io/bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: tuttime-kafka
    ports:
      - "29092:9092"  # Host access (localhost:29092)
      - "9093:9093"   # Container access (tuttime-kafka:9093)
    environment:
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_NODE_ID: 1
      KAFKA_KRAFT_CLUSTER_ID: e9hKOjhvRvyeLAlnqZQpFw
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@tuttime-kafka:9094
      KAFKA_CFG_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://tuttime-kafka:9093,EXTERNAL://localhost:29092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_LOG_DIRS: /bitnami/kafka/data
    volumes:
      - kafka-data:/bitnami/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9093 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tuttime-network

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: tuttime-kafka-ui
    ports:
      - "9001:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: tuttime-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: tuttime-kafka:9093
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - tuttime-network

  # Zipkin Distributed Tracing
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: tuttime-zipkin
    ports:
      - "9411:9411"
    environment:
      STORAGE_TYPE: mem
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9411/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tuttime-network

  # ============================================================================
  # Graylog Logging Stack
  # ============================================================================

  mongodb:
    image: mongo:5.0
    container_name: tuttime-mongodb
    volumes:
      - mongodb_data:/data/db
    networks:
      - tuttime-network

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: tuttime-opensearch
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "bootstrap.memory_lock=true"
      - "discovery.type=single-node"
      - "action.auto_create_index=true"
      - "DISABLE_SECURITY_PLUGIN=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - os_data:/usr/share/opensearch/data
    networks:
      - tuttime-network

  graylog:
    image: graylog/graylog:5.2
    container_name: tuttime-graylog
    depends_on:
      - mongodb
      - opensearch
    ports:
      - "9002:9002/tcp"
      - "12201:12201/udp"
    environment:
      GRAYLOG_PASSWORD_SECRET: ***REMOVED***
      GRAYLOG_ROOT_PASSWORD_SHA2: ***REMOVED***   # "admin"
      GRAYLOG_HTTP_BIND_ADDRESS: 0.0.0.0:9002
      GRAYLOG_HTTP_EXTERNAL_URI: http://localhost:9002/
      GRAYLOG_MONGODB_URI: mongodb://mongodb:27017/graylog
      GRAYLOG_ELASTICSEARCH_HOSTS: http://opensearch:9200
    networks:
      - tuttime-network

volumes:
  redis_data:
  kafka-data:
  mongodb_data:
  os_data:

networks:
  tuttime-network:
    name: tuttime-network
    external: false