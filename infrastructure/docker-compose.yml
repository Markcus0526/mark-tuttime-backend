services:
  # ============================================================================
  # Infrastructure Services
  # ============================================================================

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tuttime-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    env_file:
      - .env.docker
    environment:
      REDIS_PASSWORD: ${INFRA_REDIS_PASSWORD}
    command: >
      sh -c "
      if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru --bind 0.0.0.0 --protected-mode no --requirepass \"$$REDIS_PASSWORD\"
      else
        redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru --bind 0.0.0.0 --protected-mode no
      fi
      "
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tuttime-network

  # Kafka 4.0 - KRaft mode
  kafka:
    image: docker.io/bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: tuttime-kafka
    ports:
      - "29092:9092"
      - "9093:9093"
    env_file:
      - .env.docker
    environment:
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_NODE_ID: 1
      KAFKA_KRAFT_CLUSTER_ID: e9hKOjhvRvyeLAlnqZQpFw
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@tuttime-kafka:9094
      KAFKA_CFG_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://tuttime-kafka:9093,EXTERNAL://localhost:29092

      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_SASL_ENABLED_MECHANISMS: SCRAM-SHA-256
      KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL: SCRAM-SHA-256

      KAFKA_CLIENT_USERS: ${KAFKA_USERS_LIST}
      KAFKA_CLIENT_PASSWORDS: ${KAFKA_PASSWORDS_LIST}

      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_LOG_DIRS: /bitnami/kafka/data
    volumes:
      - kafka-data:/bitnami/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tuttime-network

  # Kafka UI (optional, no health check needed)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: tuttime-kafka-ui
    ports:
      - "9001:8080"
    env_file:
      - .env.docker
    environment:
      KAFKA_CLUSTERS_0_NAME: tuttime-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: tuttime-kafka:9093
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: SCRAM-SHA-256
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="user-kafka-user" password="***REMOVED***";'

    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - tuttime-network

  # Zipkin Distributed Tracing
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: tuttime-zipkin
    ports:
      - "9411:9411"
    environment:
      STORAGE_TYPE: mem
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9411/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tuttime-network

  # ============================================================================
  # Graylog Logging Stack
  # ============================================================================

  mongodb:
    image: mongo:5.0
    container_name: tuttime-mongodb
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tuttime-network

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: tuttime-opensearch
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - "bootstrap.memory_lock=true"
      - "discovery.type=single-node"
      - "action.auto_create_index=true"
      - "DISABLE_SECURITY_PLUGIN=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - os_data:/usr/share/opensearch/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9200/_cluster/health?local=true" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - tuttime-network

  graylog:
    image: graylog/graylog:5.2
    container_name: tuttime-graylog
    depends_on:
      mongodb:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    ports:
      - "9002:9002/tcp"
      - "12201:12201/udp"
    env_file:
      - .env.docker
    environment:
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2}
      GRAYLOG_HTTP_BIND_ADDRESS: 0.0.0.0:9002
      GRAYLOG_HTTP_EXTERNAL_URI: http://localhost:9002/
      GRAYLOG_MONGODB_URI: mongodb://tuttime-mongodb:27017/graylog
      GRAYLOG_ELASTICSEARCH_HOSTS: http://tuttime-opensearch:9200
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9002/api/system/lbstatus" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - tuttime-network

volumes:
  redis_data:
  kafka-data:
  mongodb_data:
  os_data:

networks:
  tuttime-network:
    name: tuttime-network
    external: false