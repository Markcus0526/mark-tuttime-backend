services:
  # ============================================================================
  # Infrastructure Services
  # ============================================================================

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tuttime-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    env_file:
      - .env.docker
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:***REMOVED***}
    command: >
      sh -c "
      if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\"
      else
        redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
      fi
      "
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tuttime-network

  # Kafka 4.0 - KRaft mode
  kafka:
    image: docker.io/bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: tuttime-kafka
    ports:
      - "29092:9092"  # Host access (localhost:29092)
      - "9093:9093"   # Container access (tuttime-kafka:9093)
    env_file:
      - .env.docker
    environment:
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_NODE_ID: 1
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      # FIXED: Changed localhost to tuttime-kafka for internal quorum
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@tuttime-kafka:9094
      KAFKA_CFG_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:29092,INTERNAL://tuttime-kafka:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_LOG_DIRS: /bitnami/kafka/data
    volumes:
      - kafka-data:/bitnami/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tuttime-network

  # Kafka UI - Web interface for managing topics and messages
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: tuttime-kafka-ui
    ports:
      - "9001:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=tuttime-local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=tuttime-kafka:9093
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - tuttime-network

  # Eureka removed - Using Kubernetes Native Discovery / Docker service names
  # Services communicate directly via Docker service names (e.g., user-service:8080)

  # Zipkin Distributed Tracing (Shared instance for all microservices)
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: tuttime-zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9411/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tuttime-network

  # ============================================================================
  # Graylog Logging Stack
  # ============================================================================

  mongodb:
    image: mongo:5.0
    container_name: tuttime-mongodb
    volumes:
      - mongodb_data:/data/db
    networks:
      - tuttime-network

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: tuttime-opensearch
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "bootstrap.memory_lock=true"
      - "discovery.type=single-node"
      - "action.auto_create_index=true" # FIXED: Graylog needs to create indices
      - "plugins.security.disabled=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - os_data:/usr/share/opensearch/data
    networks:
      - tuttime-network

  graylog:
    image: graylog/graylog:5.2
    container_name: tuttime-graylog
    depends_on:
      - mongodb
      - opensearch
    ports:
      - "9002:9002/tcp"
      - "12201:12201/udp" # Standard GELF UDP port
    env_file:
      - .env.docker
    environment:
      - GRAYLOG_PASSWORD_SECRET=${GRAYLOG_SECRET}
      - GRAYLOG_ROOT_PASSWORD_SHA2=***REMOVED***
      - GRAYLOG_HTTP_BIND_ADDRESS=0.0.0.0:9002
      - GRAYLOG_HTTP_EXTERNAL_URI=http://localhost:9002/ # FIXED: For local dev access
      - GRAYLOG_MONGODB_URI=mongodb://mongodb:27017/graylog
      - GRAYLOG_ELASTICSEARCH_HOSTS=http://opensearch:9200
    networks:
      - tuttime-network

volumes:
  redis_data:
  kafka-data:
  mongodb_data:
  os_data:

networks:
  tuttime-network:
    name: tuttime-network
    # Set to 'external: true' if your .ps1 script creates this network manually
    external: false
