syntax = "proto3";

package com.tuttime.common.proto;

option java_multiple_files = true;
option java_package = "com.tuttime.common.proto";
option java_outer_classname = "RewardsServiceProto";

// Rewards Service gRPC
service RewardsService {
  rpc ValidateReferral (ValidateReferralRequest) returns (ValidateReferralResponse);
  rpc GetReferralCode (GetReferralCodeRequest) returns (ReferralCodeResponse);
  rpc GetReferrerByCode (GetReferrerByCodeRequest) returns (GetReferrerByCodeResponse);
  rpc ValidateReferralCode (ValidateReferralCodeRequest) returns (ValidateReferralCodeResponse);
  rpc GetActiveFriendsCount (GetActiveFriendsCountRequest) returns (ActiveFriendsCountResponse);
  rpc GetBatchActiveFriendsCount (GetBatchActiveFriendsCountRequest) returns (GetBatchActiveFriendsCountResponse);
  rpc UpdateLastActiveCheckForReferrers (UpdateLastActiveCheckForReferrersRequest) returns (UpdateLastActiveCheckForReferrersResponse);
  rpc GetFriendsStatus (GetFriendsStatusRequest) returns (GetFriendsStatusResponse);
  rpc GetReferralStatistics (GetReferralStatisticsRequest) returns (GetReferralStatisticsResponse);

  // Admin analytics endpoints
  rpc GetTotalReferralsCount (GetTotalReferralsCountRequest) returns (GetTotalReferralsCountResponse);
}

message ValidateReferralRequest {
  int64 referrer_id = 1;
  int64 referee_id = 2;
}

message ValidateReferralResponse {
  bool valid = 1;
  bool can_create = 2;
  string message = 3;
}

message GetReferralCodeRequest {
  int64 user_id = 1;
}

message ReferralCodeResponse {
  string referral_code = 1;
  int32 referral_level = 2;
}

message GetReferrerByCodeRequest {
  string referral_code = 1;
}

message GetReferrerByCodeResponse {
  int64 referrer_id = 1;
  int32 referral_level = 2;
  bool valid = 3;
}

message ValidateReferralCodeRequest {
  string referral_code = 1;
}

message ValidateReferralCodeResponse {
  bool valid = 1;
  string message = 2;
  int64 referrer_id = 3;
  int32 referrer_level = 4;
}

message GetActiveFriendsCountRequest {
  int64 user_id = 1;
}

message ActiveFriendsCountResponse {
  int64 user_id = 1;
  int32 count = 2; // Count of active friends (no cap - temporary for growth)
}

message GetBatchActiveFriendsCountRequest {
  repeated int64 user_ids = 1; // List of referrer user IDs to get active friends count for
}

message GetBatchActiveFriendsCountResponse {
  map<int64, int32> active_friends_counts = 1; // userId -> active friends count
}

message UpdateLastActiveCheckForReferrersRequest {
  int64 friend_user_id = 1; // The user who started mining (referee)
}

message UpdateLastActiveCheckForReferrersResponse {
  bool success = 1;
  int32 referrers_updated = 2; // Number of referrers whose lastActiveCheck was updated
}

message GetFriendsStatusRequest {
  int64 user_id = 1;
}

message GetFriendsStatusResponse {
  repeated FriendStatus friends = 1;
}

message FriendStatus {
  int64 user_id = 1;
  string username = 2;
  string profile_picture_url = 3;
  string mining_status = 4; // "active" or "inactive"
  bool is_online = 5;
  string total_mining_speed = 6; // BigDecimal as string
  int32 friends_count = 7;
  int64 followers_count = 8;
  bool is_blocked = 9;
}

message GetReferralStatisticsRequest {
  int64 user_id = 1;
}

message GetReferralStatisticsResponse {
  int64 user_id = 1;
  int64 total_invited_friends = 2; // Total number of friends invited by this user
  int64 total_active_friends = 3;   // Total number of active (mining) friends
  int64 total_users = 4;            // Total number of users in the system
  int64 total_active_users = 5;     // Total number of active (mining) users in the system
}

// Admin analytics messages
message GetTotalReferralsCountRequest {
  // Empty - gets total referrals count across all users
}

message GetTotalReferralsCountResponse {
  int64 total_referrals = 1; // Total number of referral relationships
}

