syntax = "proto3";

package com.tuttime.common.proto;

option java_multiple_files = true;
option java_package = "com.tuttime.common.proto";
option java_outer_classname = "UserServiceProto";

// User Service gRPC
service UserService {
  rpc GetUserById (UserByIdRequest) returns (UserResponse);


  rpc ValidateUser (UserByIdRequest) returns (ValidateUserResponse);
  rpc GetUserByEmail (GetUserByEmailRequest) returns (UserResponse);
  rpc GetUserByPhone (GetUserByPhoneRequest) returns (UserResponse);
  rpc SearchUsers (SearchUsersRequest) returns (SearchUsersResponse);

  // Status and verification queries
  rpc GetUserStatus (UserByIdRequest) returns (UserStatusResponse);
  rpc IsKycVerified (UserByIdRequest) returns (KycStatusResponse);
  rpc GetUserEmail (UserByIdRequest) returns (UserEmailResponse);

  // Admin analytics endpoints
  rpc GetUserStatistics (GetUserStatisticsRequest) returns (GetUserStatisticsResponse);
  rpc GetUsersByLevel (GetUsersByLevelRequest) returns (GetUsersByLevelResponse);
  rpc GetRegistrationsPerDay (GetRegistrationsPerDayRequest) returns (GetRegistrationsPerDayResponse);
  rpc GetRegistrationsPerMonth (GetRegistrationsPerMonthRequest) returns (GetRegistrationsPerMonthResponse);

  // Leaderboard endpoints
  rpc GetTopUsersByApCredits (GetTopUsersByApCreditsRequest) returns (GetTopUsersByApCreditsResponse);
  rpc GetTopUsersByApartBalance (GetTopUsersByApartBalanceRequest) returns (GetTopUsersByApartBalanceResponse);
  rpc GetGeolocationStats (GetGeolocationStatsRequest) returns (GetGeolocationStatsResponse);

  // Admin endpoints
  rpc GetBlockedUsers (GetBlockedUsersRequest) returns (GetBlockedUsersResponse);

  // Online status endpoints
  rpc GetUsersOnlineStatus (GetUsersOnlineStatusRequest) returns (GetUsersOnlineStatusResponse);
  rpc GetOnlineUsersCount (GetOnlineUsersCountRequest) returns (GetOnlineUsersCountResponse);

  // User-to-user block endpoints
  rpc CheckUserBlocks (CheckUserBlocksRequest) returns (CheckUserBlocksResponse);

  // Apart-sharing integration endpoints
  rpc GetApartSharingStatus (UserByIdRequest) returns (ApartSharingStatusResponse);
  rpc RefreshApartSharingStatus (UserByIdRequest) returns (ApartSharingStatusResponse);

  // FCM token management endpoints
  rpc GetUserFcmTokens (UserByIdRequest) returns (GetUserFcmTokensResponse);
  rpc RemoveInvalidFcmTokens (RemoveInvalidFcmTokensRequest) returns (RemoveInvalidFcmTokensResponse);

  // Username lookup for mentions
  rpc GetUserIdsByUsernames (GetUserIdsByUsernamesRequest) returns (GetUserIdsByUsernamesResponse);
}

message UserByIdRequest {
  string user_id = 1;
}

message GetUserByEmailRequest {
  string email = 1;
}

message GetUserByPhoneRequest {
  string phone = 1;
}

message SearchUsersRequest {
  string query = 1; // Search query (searches username, first_name, last_name)
  int32 page = 2; // Page number (0-based)
  int32 size = 3; // Page size
}

message SearchUsersResponse {
  repeated UserResponse users = 1;
  int32 total_pages = 2;
  int64 total_elements = 3;
  int32 current_page = 4;
  int32 page_size = 5;
}

message ValidateUserResponse {
  bool valid = 1;
  bool active = 2;
  bool blocked = 3;
}

message UserResponse {
  string user_id = 1;
  string phone_number = 2;
  string email = 3;
  string full_name = 4;
  string profile_picture = 5;
  string status = 6;
  int64 last_login = 7; // Unix timestamp in milliseconds when user registered
  int64 created_at = 8; // Unix timestamp in milliseconds when user registered
  int64 updated_at = 9; // Unix timestamp in milliseconds when user registered
  bool is_deleted = 10;
  int64 deleted_at = 11; // Unix timestamp in milliseconds when user registered
  string roles = 12;
  string auth_methods = 13;

  // Relationships
  double latitude = 14;           // Latitude for location-based features
  double longitude = 15;          // Longitude for location-based features
}

message UserStatusResponse {
  int64 user_id = 1;
  bool is_active = 2;
  bool is_verified = 3;
  bool kyc_completed = 4;
  bool is_blocked = 5;
  string status_level = 6; // BRONZE, GOLD, PLATINUM, etc.
}

message KycStatusResponse {
  int64 user_id = 1;
  bool kyc_completed = 2;
  bool kyc_verified = 3;
  string kyc_status = 4; // PENDING, COMPLETED, REJECTED
}

message UserEmailResponse {
  int64 user_id = 1;
  string email = 2;
  bool email_verified = 3;
}

// Admin analytics messages
message GetUserStatisticsRequest {
  // Empty - gets statistics for all users
}

message GetUserStatisticsResponse {
  int64 total_users = 1;
  int64 active_users = 2;
  int64 blocked_users = 3;
}

message GetUsersByLevelRequest {
  // Empty - gets count for all levels
}

message GetUsersByLevelResponse {
  map<string, int64> users_by_level = 1; // BRONZE, SILVER, GOLD, PLATINUM, DIAMOND, ELITE -> count
}

// Leaderboard messages
message GetTopUsersByApCreditsRequest {
  int32 limit = 1; // Maximum number of users to return (default: 100)
  string period = 2; // Optional period filter: TODAY, WEEK, MONTH, YEAR, TOTAL
}

message TopUser {
  int64 user_id = 1;
  string username = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  string balance = 6; // AP Credits or APART balance
  int32 rank = 7;
  string country = 8;
  string city = 9;
  bool is_active = 10;
  string status_level = 11; // BRONZE, GOLD, PLATINUM, etc.
}

message GetTopUsersByApCreditsResponse {
  repeated TopUser users = 1;
}

message GetTopUsersByApartBalanceRequest {
  int32 limit = 1; // Maximum number of users to return (default: 100)
  string period = 2; // Optional period filter: TODAY, WEEK, MONTH, YEAR, TOTAL
}

message GetTopUsersByApartBalanceResponse {
  repeated TopUser users = 1;
}

message GetGeolocationStatsRequest {
  string country = 1; // Optional country filter
  string city = 2; // Optional city filter (requires country)
}

message GeolocationStat {
  string country = 1;
  string city = 2;
  int64 users_count = 3;
  int64 active_miners_count = 4;
  string average_ap_mining_speed = 5;
  string average_apart_reserve = 6;
  string last_conversion_distributed_amount = 7;
  string total_staked_amount = 8;
}

message GetGeolocationStatsResponse {
  repeated GeolocationStat stats = 1;
}

// Admin endpoints messages
message GetBlockedUsersRequest {
  int32 page = 1; // Page number (0-based)
  int32 size = 2; // Page size
}

message BlockedUserInfo {
  int64 user_id = 1;
  string email = 2;
  string phone = 3;
  string blocked_reason = 4;
  int64 blocked_at = 5; // Unix timestamp in milliseconds
}

message GetBlockedUsersResponse {
  repeated BlockedUserInfo users = 1;
  int32 total_pages = 2;
  int64 total_elements = 3;
  int32 current_page = 4;
  int32 page_size = 5;
}

// Online status messages
message GetUsersOnlineStatusRequest {
  repeated int64 user_ids = 1;
}

message GetUsersOnlineStatusResponse {
  map<int64, bool> online_status = 1; // user_id -> is_online
}

message GetOnlineUsersCountRequest {
  // Empty - gets count of all online users
}

message GetOnlineUsersCountResponse {
  int64 total_users = 1;
  int64 online_users = 2;
}

// User-to-user block messages
message CheckUserBlocksRequest {
  int64 requester_user_id = 1; // User ID making the request
  repeated int64 target_user_ids = 2; // List of user IDs to check for block relationship
}

message CheckUserBlocksResponse {
  map<int64, bool> blocked_status = 1; // user_id -> is_blocked (true if requester has blocked target or vice versa)
}

// Apart-sharing integration messages
message ApartSharingStatusResponse {
  int64 user_id = 1;
  bool is_registered = 2;
  bool is_verified = 3;
  bool is_blocked = 4;
  bool is_phone_confirmed = 5;
  string status = 6; // Status from Apart-sharing platform
  string status_message = 7; // Optional status message
  string verified_status_title = 8; // Verified status title
  string verified_status_color = 9; // Verified status color
  int64 status_checked_at = 10; // Unix timestamp in milliseconds when status was last checked
  string error = 11; // Error message if status fetch failed
}

// FCM token management messages
message GetUserFcmTokensResponse {
  repeated string fcm_tokens = 1; // List of FCM tokens for active devices
}

message RemoveInvalidFcmTokensRequest {
  int64 user_id = 1;
  repeated string invalid_tokens = 2; // List of invalid FCM tokens to remove
}

message RemoveInvalidFcmTokensResponse {
  int64 user_id = 1;
  int32 removed_count = 2; // Number of tokens removed
  string message = 3; // Success message
}

// Username lookup for mentions
message GetUserIdsByUsernamesRequest {
  repeated string usernames = 1;  // List of usernames to lookup (max 100)
}

message GetUserIdsByUsernamesResponse {
  map<string, int64> username_to_user_id = 1;  // username -> user_id mapping (only includes valid usernames)
}

// Registration statistics messages
message GetRegistrationsPerDayRequest {
  string start_date = 1; // ISO 8601 date format (YYYY-MM-DD)
  string end_date = 2;   // ISO 8601 date format (YYYY-MM-DD)
}

message RegistrationDayStat {
  string date = 1;      // ISO 8601 date format (YYYY-MM-DD)
  int64 count = 2;      // Number of registrations on this day
}

message GetRegistrationsPerDayResponse {
  repeated RegistrationDayStat stats = 1;
}

message GetRegistrationsPerMonthRequest {
  string start_date = 1; // ISO 8601 date format (YYYY-MM-DD)
  string end_date = 2;   // ISO 8601 date format (YYYY-MM-DD)
}

message RegistrationMonthStat {
  string month = 1;     // ISO 8601 month format (YYYY-MM)
  int64 count = 2;      // Number of registrations in this month
}

message GetRegistrationsPerMonthResponse {
  repeated RegistrationMonthStat stats = 1;
}
