syntax = "proto3";

import "google/protobuf/timestamp.proto";
package com.tuttime.common.proto;

option java_multiple_files = true;
option java_package = "com.tuttime.common.proto";
option java_outer_classname = "RestaurantServiceProto";

// Restaurant Service gRPC
service RestaurantService {
  rpc CheckAvailability (AvailabilityRequest) returns (AvailabilityResponse);

  ///////////////////// old ////////////////////////////////////////
  rpc GetRestaurantById (GetRestaurantRequest) returns (RestaurantResponse);
  rpc ValidateRestaurant (ValidateRestaurantRequest) returns (ValidateRestaurantResponse);
  rpc GetRestaurantByEmail (GetRestaurantByEmailRequest) returns (RestaurantResponse);
  rpc GetRestaurantByPhone (GetRestaurantByPhoneRequest) returns (RestaurantResponse);
  rpc SearchRestaurants (SearchRestaurantsRequest) returns (SearchRestaurantsResponse);

  // Status and verification queries
  rpc GetRestaurantStatus (GetRestaurantRequest) returns (RestaurantStatusResponse);
  rpc GetRestaurantEmail (GetRestaurantRequest) returns (RestaurantEmailResponse);

  // Name lookup for mentions
  rpc GetRestaurantIdsByNames (GetRestaurantIdsByNamesRequest) returns (GetRestaurantIdsByNamesResponse);
}

message AvailabilityRequest {
  string branch_id = 1;
  google.protobuf.Timestamp start_time = 2;
  int32 duration_minutes = 3;
  int32 party_size = 4;
}

message TableInfo {
  string table_id = 1;
  string zone_id = 2;
  int32 seats = 3;
}

message AvailabilityResponse {
  bool is_available = 1;
  repeated TableInfo available_tables = 2;
}

///////////////////// old ////////////////////////////////////////
message GetRestaurantRequest {
  int64 restaurant_id = 1;
}

message GetRestaurantByEmailRequest {
  string email = 1;
}

message GetRestaurantByPhoneRequest {
  string phone = 1;
}

message SearchRestaurantsRequest {
  string query = 1; // Search query (searches name, first_name, last_name)
  int32 page = 2; // Page number (0-based)
  int32 size = 3; // Page size
}

message SearchRestaurantsResponse {
  repeated RestaurantResponse restaurants = 1;
  int32 total_pages = 2;
  int64 total_elements = 3;
  int32 current_page = 4;
  int32 page_size = 5;
}

message ValidateRestaurantRequest {
  int64 restaurant_id = 1;
}

message ValidateRestaurantResponse {
  bool valid = 1;
  bool active = 2;
  bool blocked = 3;
}

message RestaurantResponse {
  int64 restaurant_id = 1;
  string email = 2;
  string name = 3;
  string about_image_url = 4;
  string about = 5;
  string websites = 6;
  bool is_verified = 7;
  bool is_active = 8;
  bool is_blocked = 9;
  int64 registration_date = 10; // Unix timestamp in milliseconds when restaurant registered

  // Contact information
  string phone = 11;              // Phone number
  string telegram = 12;           // Telegram name
  string instagram = 13;          // Instagram name

  // Location information
  string country = 14;            // Country name
  string city = 15;               // City name
  double latitude = 16;           // Latitude for location-based features
  double longitude = 17;          // Longitude for location-based features

  // Language preference
  string preferred_language = 23; // Restaurant preferred language code (e.g., en, ko, ja, zh-CN) for notification translation
}

message RestaurantStatusResponse {
  int64 restaurant_id = 1;
  bool is_active = 2;
  bool is_verified = 3;
  bool is_blocked = 4;
  string status_level = 5; // BRONZE, GOLD, PLATINUM, etc.
}

message RestaurantEmailResponse {
  int64 restaurant_id = 1;
  string email = 2;
  bool email_verified = 3;
}

message TopRestaurant {
  int64 restaurant_id = 1;
  string name = 2;
  string email = 3;
  string balance = 4; // AP Credits or APART balance
  int32 rank = 5;
  string country = 6;
  string city = 7;
  bool is_active = 8;
}

message GetTopRestaurantsByApCreditsResponse {
  repeated TopRestaurant restaurants = 1;
}

message GetTopRestaurantsByApartBalanceRequest {
  int32 limit = 1; // Maximum number of restaurants to return (default: 100)
  string period = 2; // Optional period filter: TODAY, WEEK, MONTH, YEAR, TOTAL
}

// Admin endpoints messages
message GetBlockedRestaurantsRequest {
  int32 page = 1; // Page number (0-based)
  int32 size = 2; // Page size
}

message BlockedRestaurantInfo {
  int64 restaurant_id = 1;
  string email = 2;
  string phone = 3;
  string blocked_reason = 4;
  int64 blocked_at = 5; // Unix timestamp in milliseconds
}

message GetBlockedRestaurantsResponse {
  repeated BlockedRestaurantInfo restaurants = 1;
  int32 total_pages = 2;
  int64 total_elements = 3;
  int32 current_page = 4;
  int32 page_size = 5;
}

// Online status messages
message GetRestaurantsOnlineStatusRequest {
  repeated int64 restaurant_ids = 1;
}

message GetRestaurantsOnlineStatusResponse {
  map<int64, bool> online_status = 1; // restaurant_id -> is_online
}

message GetOnlineRestaurantsCountRequest {
  // Empty - gets count of all online restaurants
}

message GetOnlineRestaurantsCountResponse {
  int64 total_restaurants = 1;
  int64 online_restaurants = 2;
}

// Restaurant-to-restaurant block messages
message CheckRestaurantBlocksRequest {
  int64 requester_restaurant_id = 1; // Restaurant ID making the request
  repeated int64 target_restaurant_ids = 2; // List of restaurant IDs to check for block relationship
}

message CheckRestaurantBlocksResponse {
  map<int64, bool> blocked_status = 1; // restaurant_id -> is_blocked (true if requester has blocked target or vice versa)
}

// Name lookup for mentions
message GetRestaurantIdsByNamesRequest {
  repeated string names = 1;  // List of names to lookup (max 100)
}

message GetRestaurantIdsByNamesResponse {
  map<string, int64> name_to_restaurant_id = 1;  // name -> restaurant_id mapping (only includes valid names)
}
