syntax = "proto3";

package com.tuttime.common.proto;

option java_multiple_files = true;
option java_package = "com.tuttime.common.proto";
option java_outer_classname = "StakingServiceProto";

// Staking Service gRPC
service StakingService {
  rpc GetStakingPositions (GetStakingPositionsRequest) returns (StakingPositionsResponse);
  rpc CalculateRewards (CalculateRewardsRequest) returns (CalculateRewardsResponse);
  
  // Admin analytics endpoints
  rpc GetTotalStakingApy (GetTotalStakingApyRequest) returns (GetTotalStakingApyResponse);
  rpc GetTotalRewardsClaimed (GetTotalRewardsClaimedRequest) returns (GetTotalRewardsClaimedResponse);
  rpc GetTvl (GetTvlRequest) returns (GetTvlResponse);
  
  // Leaderboard endpoints
  rpc GetTopStakings (GetTopStakingsRequest) returns (GetTopStakingsResponse);
  
  // Admin history endpoints
  rpc GetStakingHistory (GetStakingHistoryRequest) returns (GetStakingHistoryResponse);
  rpc GetUnstakingHistory (GetUnstakingHistoryRequest) returns (GetUnstakingHistoryResponse);
}

message GetStakingPositionsRequest {
  int64 user_id = 1;
}

message StakingPositionsResponse {
  repeated StakingPosition positions = 1;
}

message StakingPosition {
  int64 staking_id = 1;
  int64 pool_id = 2;
  string amount = 3;
  string boost_multiplier = 4;
  string rewards_earned = 5;
  string status = 6;
}

message CalculateRewardsRequest {
  int64 user_id = 1;
}

message CalculateRewardsResponse {
  string total_rewards = 1;
  bool success = 2;
}

// Admin analytics messages
message GetTotalStakingApyRequest {
  // Empty - gets weighted average APY for all pools
}

message GetTotalStakingApyResponse {
  string total_apy = 1; // Weighted average APY across all staking pools
}

message GetTotalRewardsClaimedRequest {
  // Empty - gets total rewards claimed by all users
}

message GetTotalRewardsClaimedResponse {
  string total_rewards_claimed = 1; // Total rewards claimed from staking
}

message GetTvlRequest {
  // Empty - gets total value locked
}

message GetTvlResponse {
  string tvl = 1; // Total Value Locked (total staked amount)
}

// Leaderboard messages
message GetTopStakingsRequest {
  string sort_by = 1; // Sort by "apy" or "miningBonus"
  int64 pool_id = 2; // Optional pool ID filter (0 = all pools)
  int32 limit = 3; // Maximum number of positions to return
}

message TopStaking {
  int64 staking_id = 1;
  int64 user_id = 2;
  string username = 3;
  int64 pool_id = 4;
  string pool_name = 5;
  string amount = 6;
  string apy_percentage = 7;
  string mining_bonus = 8;
  string rewards_earned = 9;
  int32 rank = 10;
  string status = 11; // ACTIVE, COMPLETED, etc.
}

message GetTopStakingsResponse {
  repeated TopStaking stakings = 1;
}

// Admin history messages
message GetStakingHistoryRequest {
  int64 pool_id = 1; // Optional: filter by pool
  int64 user_id = 2; // Optional: filter by user
  string start_date = 3; // Optional: ISO 8601 datetime format
  string end_date = 4; // Optional: ISO 8601 datetime format
  int32 page = 5; // Page number (0-indexed)
  int32 size = 6; // Page size
}

message GetUnstakingHistoryRequest {
  int64 pool_id = 1; // Optional: filter by pool
  int64 user_id = 2; // Optional: filter by user
  string start_date = 3; // Optional: ISO 8601 datetime format
  string end_date = 4; // Optional: ISO 8601 datetime format
  int32 page = 5; // Page number (0-indexed)
  int32 size = 6; // Page size
}

message StakingHistory {
  int64 staking_id = 1;
  int64 user_id = 2;
  string username = 3;
  int64 pool_id = 4;
  string pool_name = 5;
  string amount = 6;
  string status = 7; // ACTIVE, UNLOCKING, COMPLETED, CANCELLED
  string staked_at = 8; // ISO 8601 datetime format
  string unstake_requested_at = 9; // ISO 8601 datetime format (optional, for unstakes)
  string unlock_at = 10; // ISO 8601 datetime format
  string operation_type = 11; // STAKE or UNSTAKE
}

message GetStakingHistoryResponse {
  repeated StakingHistory histories = 1;
  int32 total_pages = 2;
  int64 total_elements = 3;
  bool has_next = 4;
}

message GetUnstakingHistoryResponse {
  repeated StakingHistory histories = 1;
  int32 total_pages = 2;
  int64 total_elements = 3;
  bool has_next = 4;
}

