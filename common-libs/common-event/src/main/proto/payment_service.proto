syntax = "proto3";

import "google/protobuf/timestamp.proto";
package com.tuttime.common.proto;

option java_multiple_files = true;
option java_package = "com.tuttime.common.proto";
option java_outer_classname = "PaymentServiceProto";

// Payment Service gRPC
service PaymentService {
  rpc createCheckoutSession (PaymentSessionRequest) returns (PaymentSessionResponse);

}

// Request from Booking to Payment
message PaymentSessionRequest {
  string booking_id = 1;
  string user_id = 2;
  double amount = 3;
  string currency = 4;
}

// Response from Payment back to Booking
message PaymentSessionResponse {
  string stripe_session_id = 1;
  string checkout_url = 2;
  string status = 3;
}