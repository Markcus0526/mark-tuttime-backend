syntax = "proto3";

package com.tuttime.common.event.proto;

option java_multiple_files = true;
option java_package = "com.tuttime.common.event.proto";
option java_outer_classname = "PaymentServiceProto";

// Payment Service gRPC
service PaymentService {

  rpc CreateCheckoutSession (PaymentSessionRequest) returns (PaymentSessionResponse);

  rpc ProcessRefund(ProcessRefundRequest) returns (ProcessRefundResponse);

  rpc GetPaymentCounts(GetPaymentCountsRequest) returns (GetPaymentCountsResponse);
}

// rpc CreateCheckoutSession (PaymentSessionRequest) returns (PaymentSessionResponse);
message PaymentSessionRequest {
  string booking_id = 1;
  string user_id = 2;
  string branch_id = 3;
  string amount = 4;
  string currency = 5;
}


message PaymentSessionResponse {
  string stripe_session_id = 1;
  string checkout_url = 2;
  string status = 3;
}

// rpc ProcessRefund(ProcessRefundRequest) returns (ProcessRefundResponse);
message ProcessRefundRequest {
  string booking_id = 1;
  string payment_id = 2;
  string amount = 3;
  string currency = 4;
  string reason = 5;
}

message ProcessRefundResponse {
  bool status = 1;          // "succeeded", "pending", or "canceled"
}

// rpc GetPaymentCounts(GetPaymentCountsRequest) returns (GetPaymentCountsResponse);
message GetPaymentCountsRequest {
  string branch_id = 1;
  string start_date = 2;
  string end_date = 3;
}

message GetPaymentCountsResponse {
  int64 payments = 1;
}