syntax = "proto3";

package com.tuttime.common.event.proto;

option java_multiple_files = true;
option java_package = "com.tuttime.common.event.proto";
option java_outer_classname = "MenuServiceProto";

// Menu Service gRPC
service MenuService {

  rpc GetPreOrderMenu (GetPreOrderMenuRequest) returns (GetPreOrderMenuResponse);

  rpc GetMenuDetails(GetMenuDetailsRequest) returns (GetMenuDetailsResponse);

  rpc GetPriceForOrder (GetPriceForOrderRequest) returns (GetPriceForOrderResponse);

  rpc GetActiveOrderDiscounts(GetActiveOrderDiscountsRequest) returns (GetActiveOrderDiscountsResponse);

}

// rpc GetPreOrderMenu (GetPreOrderMenuRequest) returns (GetPreOrderMenuResponse);
message GetPreOrderMenuRequest {
  string branch_id = 1;
}

message GetPreOrderMenuResponse {
  repeated MenuItemDetailPto items = 1;
}

message MenuItemDetailPto {
  string menu_item_id = 1;
  string name = 2;
  string description = 3;
  string base_price = 4;
  string category_id = 5;
  string category_name = 6;
  bool available = 7;
  repeated ModifierGroupPto modifier_groups = 8;
}

message ModifierGroupPto {
  string group_id = 1;
  string group_name = 2;
  int32 min_select = 3;
  int32 max_select = 4;
  repeated ModifierOptionPto options = 5;
}

message ModifierOptionPto {
  string option_id = 1;
  string name = 2;
  string extra_price = 3;
}

// rpc GetMenuDetails(GetMenuDetailsRequest) returns (GetMenuDetailsResponse);
message GetMenuDetailsRequest {
  repeated string menu_item_ids = 1;
}

message GetMenuDetailsResponse {
  repeated MenuItemDetailPto items = 1;
}

// rpc GetPriceForOrder (GetPriceForOrderRequest) returns (GetPriceForOrderResponse);
message GetPriceForOrderRequest {
  string menu_item_id = 1;
  repeated string modifier_ids = 2; // List of selected modifiers
}

message GetPriceForOrderResponse {
  string verified_total_price = 1; // Return as string for BigDecimal precision
}

// rpc GetActiveOrderDiscounts(GetActiveOrderDiscountsRequest) returns (GetActiveOrderDiscountsResponse);
message GetActiveOrderDiscountsRequest {
  string branch_id = 1;
}

message GetActiveOrderDiscountsResponse {
  repeated ActiveDiscountDto discounts = 1;
}

message ActiveDiscountDto {
  string id = 1;
  string name = 2;
  string discount_type = 3;  // "PERCENTAGE" or "FIXED_AMOUNT"
  double amount = 4;
  string applies_to = 5;     // "ORDER"
  string start_date = 6;
  string end_date = 7;
}