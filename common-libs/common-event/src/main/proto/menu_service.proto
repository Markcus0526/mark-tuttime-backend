syntax = "proto3";

package com.tuttime.common.proto;

option java_multiple_files = true;
option java_package = "com.tuttime.common.proto";
option java_outer_classname = "MenuServiceProto";

// Menu Service gRPC
service MenuService {
  rpc getPriceForOrder (PriceRequest) returns (PriceResponse);

}

message PriceRequest {
  string item_id = 1;
  repeated string modifier_ids = 2;
}

message PriceResponse {
  double base_price = 1;
  double modifiers_total = 2;
}
