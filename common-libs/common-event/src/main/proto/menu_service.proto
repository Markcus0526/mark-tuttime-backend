syntax = "proto3";

package com.tuttime.common.proto;

option java_multiple_files = true;
option java_package = "com.tuttime.common.proto";
option java_outer_classname = "MenuServiceProto";

// Menu Service gRPC
service MenuService {

  rpc getPriceForOrder (PriceRequest) returns (PriceResponse);

  rpc getPreOrderMenu (MenuRequest) returns (MenuResponse);

  rpc GetMenuDetails(MenuDetailsRequest) returns (MenuDetailsResponse);

}

message PriceRequest {
  string item_id = 1;
  repeated string modifier_ids = 2;
}

message PriceResponse {
  double base_price = 1;
  double modifiers_total = 2;
}

message MenuRequest {
  string branch_id = 1;
}

message MenuResponse {
  repeated MenuItemDetail items = 1;
}

message MenuItemDetail {
  string menu_item_id = 1;
  string name = 2;
  string description = 3;
  double base_price = 4;
  string category = 5;
  bool available = 6;
  repeated ModifierGroup modifier_groups = 7;
}

message ModifierGroup {
  string group_id = 1;
  string group_name = 2;
  int32 min_select = 3;
  int32 max_select = 4;
  repeated ModifierOption options = 5;
}

message ModifierOption {
  string option_id = 1;
  string name = 2;
  double extra_price = 3;
}

message MenuDetailsRequest {
  repeated string menu_item_ids = 1;
}

message MenuDetailsResponse {
  repeated MenuItemDetail items = 1;
}