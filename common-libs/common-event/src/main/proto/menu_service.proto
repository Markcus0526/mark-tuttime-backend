syntax = "proto3";

package com.tuttime.common.proto;

option java_multiple_files = true;
option java_package = "com.tuttime.common.proto";
option java_outer_classname = "MenuServiceProto";

// Menu Service gRPC
service MenuService {

  rpc getPreOrderMenu (MenuRequest) returns (MenuResponse);

  rpc GetMenuDetails(MenuDetailsRequest) returns (MenuDetailsResponse);

  rpc GetPriceForOrder (PriceRequest) returns (PriceResponse);
}

// rpc getPreOrderMenu (MenuRequest) returns (MenuResponse);
message MenuRequest {
  string branch_id = 1;
}

message MenuResponse {
  repeated MenuItemDetailResponse items = 1;
}

message MenuItemDetailResponse {
  string menu_item_id = 1;
  string name = 2;
  string description = 3;
  string base_price = 4;
  string category = 5;
  bool available = 6;
  repeated ModifierGroupResponse modifier_groups = 7;
}

message ModifierGroupResponse {
  string group_id = 1;
  string group_name = 2;
  int32 min_select = 3;
  int32 max_select = 4;
  repeated ModifierOptionResponse options = 5;
}

message ModifierOptionResponse {
  string option_id = 1;
  string name = 2;
  string extra_price = 3;
}

// rpc GetMenuDetails(MenuDetailsRequest) returns (MenuDetailsResponse);
message MenuDetailsRequest {
  repeated string menu_item_ids = 1;
}

message MenuDetailsResponse {
  repeated MenuItemDetailResponse items = 1;
}

// rpc GetPriceForOrder (PriceRequest) returns (PriceResponse);
message PriceRequest {
  string menu_item_id = 1;
  repeated string modifier_ids = 2; // List of selected modifiers
}

message PriceResponse {
  string verified_total_price = 1; // Return as string for BigDecimal precision
}