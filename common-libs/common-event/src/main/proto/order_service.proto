syntax = "proto3";

package com.tuttime.common.event.proto;

option java_multiple_files = true;
option java_package = "com.tuttime.common.event.proto";
option java_outer_classname = "OrderServiceProto";

// Order Service gRPC
service OrderService {

  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);

  rpc UpdateOrder(UpdateOrderRequest) returns (UpdateOrderResponse);

  rpc GetOrderDetail (OrderDetailRequest) returns (OrderDetailResponse);

  rpc CancelAndRefund(CancelOrderRequest) returns (CancelOrderResponse);

  rpc GetTopItems(GetTopItemsRequest) returns (GetTopItemsResponse);

  rpc GetRevenueBreakdown(GetRevenueBreakdownRequest) returns (GetRevenueBreakdownResponse);

  rpc GetMenuPerformance(GetMenuPerformanceRequest) returns (GetMenuPerformanceResponse);

}

// rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);
message CreateOrderRequest {
  string booking_id = 1;
  string user_id = 2;
  string branch_id = 3;
  repeated string table_ids = 4;
  string guest_name = 5;
  string guest_phone = 6;
  string special_request = 7;
  // Use repeated to transfer a list of items
  repeated OrderItemRequest items = 8;
}

message OrderItemRequest {
  string menu_item_id = 1;
  int32 quantity = 2;
  string price = 3; // String to maintain BigDecimal precision
  repeated ModifierRequest modifiers = 4;
}

message ModifierRequest {
  string modifier_id = 1;
  string price_adjustment = 2;
}

message CreateOrderResponse {
  string order_id = 1;
  string status = 2;
}

// rpc UpdateOrder(UpdateOrderRequest) returns (UpdateOrderResponse);
message UpdateOrderRequest {
  string order_id = 1;
  repeated string table_ids = 2;
  string new_booking_time = 3; // Required for KDS scheduling
  string guest_name = 4;
  string guest_phone = 5;
  string special_request = 6;
  string new_total = 7;        // String for BigDecimal precision
  repeated OrderItemRequest items = 8; // Updated list of items/modifiers
}

message UpdateOrderResponse {
  bool success = 1;
  string message = 2;
}

// rpc getOrderDetail (OrderRequest) returns (OrderDetailsResponse);
message OrderDetailRequest {
  string order_id = 1;
}

message OrderDetailResponse {
  string order_id = 1 [json_name = "id"];
  string branch_id = 2; // REQUIRED: For POS Config lookup
  string table_id = 3;  // REQUIRED: For R-Keeper table layout
  string booking_id = 4;
  double total_amount = 5;
  repeated OrderItemDetailResponse items = 6;
}

message OrderItemDetailResponse {
  string menu_item_id = 1;   // For mapping lookup
  string pos_id = 2;         // External POS ID (if already known)
  string menu_item_name = 3;
  int32 quantity = 4;
  double price = 5;
  repeated string modifiers = 6;
}

// rpc CancelAndRefund(CancelOrderRequest) returns (CancelOrderResponse);
message CancelOrderRequest {
  string booking_id = 1;
  string order_id = 2;
  string payment_id = 3;
  string reason = 4;
}

message CancelOrderResponse {
  bool success = 1;
  string refund_transaction_id = 2;
  string amount_refunded = 3;
  string reason = 4;
}

// rpc GetTopItems(GetTopItemsRequest) returns (GetTopItemsResponse);
message GetTopItemsRequest {
  string branch_id = 1;
  string from_date = 2;   // ISO date string, e.g. "2025-05-01"
  string to_date = 3;
  int32 limit = 4;
}

message GetTopItemsResponse {
  repeated TopItem items = 1;
}

message TopItem {
  string item_id = 1;
  int32 quantity = 2;
  string revenue = 3;
}

// rpc GetRevenueBreakdown(GetRevenueBreakdownRequest) returns (GetRevenueBreakdownResponse);
message GetRevenueBreakdownRequest {
  string branch_id = 1;
  string granularity = 2;   // "HOUR" or "DAY"
  string date = 3;          // ISO date (e.g., "2025-05-12")
}

message GetRevenueBreakdownResponse {
  string granularity = 1;
  repeated RevenuePoint points = 2;
  string total_gmv = 3;
  int32 total_orders = 4;
}

message RevenuePoint {
  string period = 1;
  string gmv = 2;
  int32 orders = 3;
}

// rpc GetMenuPerformance(GetMenuPerformanceRequest) returns (GetMenuPerformanceResponse);
message GetMenuPerformanceRequest {
  string branch_id = 1;
  string start_date = 2;   // ISO date
  string end_date = 3;
  string group_by = 4;      // "CATEGORY" or "ITEM"
}

message GetMenuPerformanceResponse {
  string group_by = 1;
  repeated MenuPerformancePoint points = 2;
}

message MenuPerformancePoint {
  string id = 1;          // category_id or item_id
  string name = 2;
  string revenue = 3;      // decimal as string
  int32 quantity = 4;
}