syntax = "proto3";

import "google/protobuf/timestamp.proto";
package com.tuttime.common.proto;

option java_multiple_files = true;
option java_package = "com.tuttime.common.proto";
option java_outer_classname = "RestaurantServiceProto";

// Restaurant Service gRPC
service RestaurantService {

  rpc validateBranch (BranchRequest) returns (BranchResponse);

  rpc checkAvailableTableForBooking (AvailableTableRequest) returns (AvailableTableResponse);

  rpc getTablesForBooking (SlotAvailabilityRequest) returns (TableListResponse);

  rpc VerifyOwnerAndGetRestaurantIdForUser (OwnerVerificationRequest) returns (OwnerVerificationResponse);

  rpc GetStaffByRestaurantForUser (StaffRequest) returns (StaffListResponse);

}

message BranchRequest {
  string branch_id = 1; // Branch UUID
  string user_id = 2; // User UUID
}

message BranchResponse {
  bool exists = 1;
}

message AvailableTableRequest {
  string restaurant_id = 1;
  string branch_id = 2;
  string zone_id = 3;
  string table_id = 4;
  int32 party_size = 5;
  int32 duration_minutes = 6;
  google.protobuf.Timestamp start_time = 7;
}

message AvailableTableResponse {
  bool is_available = 1;
  int32 seats = 2;
}

message SlotAvailabilityRequest {
  string restaurant_id = 1;
  string branch_id = 2;
  google.protobuf.Timestamp target_date = 3;
  int32 party_size = 4; // Crucial filter: only return tables that can fit this many people
  optional string zone_id = 5; // Optional: filter for specific areas like 'Terrace' or 'VIP'
}

message TableListResponse {
  repeated TableInfo tables = 1;
}

message TableInfo {
  string table_id = 1;
  string table_number = 2;
  string zone_name = 3;
  int32 min_capacity = 4;
  int32 max_capacity = 5;
  bool is_active = 6;
}

message OwnerVerificationRequest {
  string user_id = 1;
}

message OwnerVerificationResponse {
  bool is_owner = 1;
  string restaurant_id = 2;
}

message StaffRequest {
  string restaurant_id = 1;
  optional string branch_id = 2; // Optional: if filtering for a specific branch
}

message StaffListResponse {
  repeated StaffMember users = 1;
}

message StaffMember {
  string user_id = 1;
  string name = 2;
  string email = 3;
  string role = 4; // e.g., "MANAGER", "WAITER", "CHEF"
  optional string branch_name = 5;
}