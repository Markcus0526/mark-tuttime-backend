syntax = "proto3";

import "google/protobuf/timestamp.proto";
package com.tuttime.common.proto;

option java_multiple_files = true;
option java_package = "com.tuttime.common.proto";
option java_outer_classname = "RestaurantServiceProto";

// Restaurant Service gRPC
service RestaurantService {

  rpc ValidateBranchPermission (BranchPermissionRequest) returns (BranchPermissionResponse);

  rpc CheckAvailableTableForBooking (AvailableTableRequest) returns (AvailableTableResponse);

  rpc getTablesForBooking (SlotAvailabilityRequest) returns (TableListResponse);

  rpc GetStaffForUser (StaffUserRequest) returns (StaffUserResponse);

}

message BranchPermissionRequest {
  string branch_id = 1; // Branch or Restaurant UUID
  string user_id = 2; // User UUID
  string user_roles = 3;
}

message BranchPermissionResponse {
  bool valid = 1;
}

message AvailableTableRequest {
  string table_id = 1;
  int32 party_size = 2;
  int32 duration_minutes = 3;
  google.protobuf.Timestamp start_time = 4;
}

message AvailableTableResponse {
  string restaurant_id = 1;
  string branch_id = 2;
  string zone_id = 3;
  string table_id = 4;
  bool available = 5;
  int32 seats = 6;
}

message SlotAvailabilityRequest {
  string restaurant_id = 1;
  string branch_id = 2;
  google.protobuf.Timestamp target_date = 3;
  int32 party_size = 4; // Crucial filter: only return tables that can fit this many people
  optional string zone_id = 5; // Optional: filter for specific areas like 'Terrace' or 'VIP'
}

message TableListResponse {
  string branch_id = 1;
  string restaurant_id = 2;
  string branch_name = 3;
  string restaurant_name = 4;
  repeated TableInfo tables = 5;
}

message TableInfo {
  string table_id = 1;
  string zone_id = 2;
  string zone_name = 3;
  string table_label = 4;
  int32 min_capacity = 5;
  int32 max_capacity = 6;
}

message StaffUserRequest {
  string user_id = 1;
}

message StaffUserResponse {
  string restaurant_id = 1;
  string branch_id = 2; // Optional, can be empty string
  string entity_name = 3;
  string role_name = 4;
  bool active = 5;
}
