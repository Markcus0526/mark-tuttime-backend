syntax = "proto3";

package com.tuttime.common.event.proto;

option java_multiple_files = true;
option java_package = "com.tuttime.common.event.proto";
option java_outer_classname = "RestaurantServiceProto";

// Restaurant Service gRPC
service RestaurantService {

  rpc GetStaffForUser(GetStaffForUserRequest) returns (GetStaffForUserResponse);

  rpc ValidateBranchPermission(ValidateBranchPermissionRequest) returns (ValidateBranchPermissionResponse);

  rpc GetTableDetail(GetTableDetailRequest) returns (GetTableDetailResponse);

  rpc GetBranchSlots(GetBranchSlotsRequest) returns (GetBranchSlotsResponse);

  rpc GetBranchSchedule(GetBranchScheduleRequest) returns (GetBranchScheduleResponse);

  rpc GetBranchDetail(GetBranchDetailRequest) returns (GetBranchDetailResponse);

  rpc GetTableHierarchyDetail(GetTableHierarchyDetailRequest) returns (GetTableHierarchyDetailResponse);

  rpc ValidateBranch(ValidateBranchRequest) returns (ValidateBranchResponse);

  rpc GetBranchManagers(GetBranchManagersRequest) returns (GetBranchManagersResponse);

  rpc FindAvailableTable(FindAvailableTableRequest) returns (FindAvailableTableResponse);

  rpc GetBranchTotalTables(GetBranchTotalTablesRequest) returns (GetBranchTotalTablesResponse);
}

// rpc GetStaffForUser(GetStaffForUserRequest) returns (GetStaffForUserResponse);
message GetStaffForUserRequest {
  string user_id = 1;
}

message GetStaffForUserResponse {
  string restaurant_id = 1;
  string branch_id = 2; // Optional, can be empty string
  string entity_name = 3;
  string role_name = 4;
  bool active = 5;
}

// rpc ValidateBranchPermission(ValidateBranchPermissionRequest) returns (ValidateBranchPermissionResponse);
message ValidateBranchPermissionRequest {
  string branch_id = 1; // Branch or Restaurant UUID
  string user_id = 2; // User UUID
  string user_roles = 3;
}

message ValidateBranchPermissionResponse {
  bool valid = 1;
}

// rpc GetTableDetail(GetTableDetailRequest) returns (GetTableDetailResponse);
message GetTableDetailRequest {
  string table_id = 1;
}

message GetTableDetailResponse {
  string restaurant_id = 1;
  string branch_id = 2;
  string zone_id = 3;
  string table_id = 4;
  string table_label = 5;
  string branch_name = 6;
  int32 total_tables = 7;
  bool available = 8;
}

// rpc GetBranchSlots(GetBranchSlotsRequest) returns (GetBranchSlotsResponse);
message GetBranchSlotsRequest {
  string restaurant_id = 1;
  string branch_id = 2;
  string target_date = 3;
  int32 party_size = 4; // Crucial filter: only return tables that can fit this many people
  optional string zone_id = 5; // Optional: filter for specific areas like 'Terrace' or 'VIP'
}

message GetBranchSlotsResponse {
  string branch_id = 1;
  string restaurant_id = 2;
  string branch_name = 3;
  string restaurant_name = 4;
  repeated TableSlotPto tables = 5;
}

message TableSlotPto {
  string table_id = 1;
  string zone_id = 2;
  string zone_name = 3;
  string table_label = 4;
  int32 min_capacity = 5;
  int32 max_capacity = 6;
}

// rpc GetBranchSchedule(GetBranchScheduleRequest) returns (GetBranchScheduleResponse);
message GetBranchScheduleRequest {
  string branch_id = 1;
  int32 day_of_week = 2; // 0-6 (Sunday to Saturday)
}

message GetBranchScheduleResponse {
  string open_time = 1;  // "HH:mm" format
  string close_time = 2; // "HH:mm" format
  bool closed = 3;
}

// rpc GetBranchDetail(GetBranchDetailRequest) returns (GetBranchDetailResponse);
message GetBranchDetailRequest {
  string branch_id = 1;
}

message GetBranchDetailResponse {
  string branch_id = 1;
  string restaurant_id = 2;
  string branch_name = 3;
  string branch_address = 4;
  string branch_phone = 5;
  string restaurant_name = 6;
}

// rpc GetTableHierarchyDetail(GetTableHierarchyDetailRequest) returns (GetTableHierarchyDetailResponse);
message GetTableHierarchyDetailRequest {
  string table_id = 1;
}

message GetTableHierarchyDetailResponse {
  string table_id = 1;
  string zone_id = 2;
  string branch_id = 3;
  string restaurant_id = 4;
  string table_label = 5;
  string zone_name = 6;
  string branch_name = 7;
  string branch_address = 8;
  string branch_phone = 9;
  string restaurant_name = 10;
}

// rpc ValidateBranch(ValidateBranchRequest) returns (ValidateBranchResponse);
message ValidateBranchRequest {
  string branch_id = 1;
}

message ValidateBranchResponse {
  bool exists = 1;
  string name = 2;
  bool active = 3;
}

// rpc GetBranchManagers(GetBranchManagersRequest) returns (GetBranchManagersResponse);
message GetBranchManagersRequest {
  string branch_id = 1;
}

message GetBranchManagersResponse {
  repeated string manager_ids = 1;
}

// rpc FindAvailableTable(FindAvailableTableRequest) returns (FindAvailableTableResponse);
message FindAvailableTableRequest {
  string branch_id = 1;
  optional string zone_id = 2;          // optional – if not provided, search entire branch
  int32 party_size = 3;
  string start_time = 4;                // ISO 8601 timestamp (e.g., "2025-05-11T19:00:00Z")
}

message FindAvailableTableResponse {
  bool available = 1;
  string table_id = 2;
  string zone_id = 3;
  int32 capacity = 4;
  string table_label = 5;
}

// rpc GetBranchTotalTables(GetBranchTotalTablesRequest) returns (GetBranchTotalTablesResponse);
message GetBranchTotalTablesRequest {
  string branch_id = 1;
}

message GetBranchTotalTablesResponse {
  int32 total_tables = 1;
}