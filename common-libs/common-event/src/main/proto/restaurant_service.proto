syntax = "proto3";

import "google/protobuf/timestamp.proto";
package com.tuttime.common.proto;

option java_multiple_files = true;
option java_package = "com.tuttime.common.proto";
option java_outer_classname = "RestaurantServiceProto";

// Restaurant Service gRPC
service RestaurantService {

  rpc ValidateBranch (BranchRequest) returns (BranchResponse);

  rpc CheckAvailableTableForBooking (AvailableTableRequest) returns (AvailableTableResponse);

}

message BranchRequest {
  string branch_id = 1; // Branch UUID
  string user_id = 2; // User UUID
}

message BranchResponse {
  bool exists = 1;
}

message AvailableTableRequest {
  string restaurant_id = 1;
  string branch_id = 2;
  string zone_id = 3;
  string table_id = 4;
  int32 party_size = 5;
  int32 duration_minutes = 6;
  google.protobuf.Timestamp start_time = 7;
}

message AvailableTableResponse {
  bool is_available = 1;
  int32 seats = 2;
}



