syntax = "proto3";

import "google/protobuf/timestamp.proto";
package com.tuttime.common.proto;

option java_multiple_files = true;
option java_package = "com.tuttime.common.proto";
option java_outer_classname = "RestaurantServiceProto";

// Restaurant Service gRPC
service RestaurantService {

  rpc GetStaffForUser (StaffUserRequest) returns (StaffUserResponse);

  rpc ValidateBranchPermission (BranchPermissionRequest) returns (BranchPermissionResponse);

  rpc GetTableDetail (TableDetailRequest) returns (TableDetailResponse);

  rpc GetBranchSlots (BranchSlotsRequest) returns (BranchSlotsResponse);

  rpc GetBranchSchedule (ScheduleRequest) returns (ScheduleResponse);

  rpc GetBranchDetail (BranchDetailRequest) returns (BranchDetailResponse);

}

////////////
message StaffUserRequest {
  string user_id = 1;
}

message StaffUserResponse {
  string restaurant_id = 1;
  string branch_id = 2; // Optional, can be empty string
  string entity_name = 3;
  string role_name = 4;
  bool active = 5;
}

////////////////
message BranchPermissionRequest {
  string branch_id = 1; // Branch or Restaurant UUID
  string user_id = 2; // User UUID
  string user_roles = 3;
}

message BranchPermissionResponse {
  bool valid = 1;
}

////////////////
message TableDetailRequest {
  string table_id = 1;
}

message TableDetailResponse {
  string restaurant_id = 1;
  string branch_id = 2;
  string zone_id = 3;
  string table_id = 4;
  bool available = 5;
}

////////////////
message BranchSlotsRequest {
  string restaurant_id = 1;
  string branch_id = 2;
  google.protobuf.Timestamp target_date = 3;
  int32 party_size = 4; // Crucial filter: only return tables that can fit this many people
  optional string zone_id = 5; // Optional: filter for specific areas like 'Terrace' or 'VIP'
}

message BranchSlotsResponse {
  string branch_id = 1;
  string restaurant_id = 2;
  string branch_name = 3;
  string restaurant_name = 4;
  repeated TableSlotResponse tables = 5;
}

message TableSlotResponse {
  string table_id = 1;
  string zone_id = 2;
  string zone_name = 3;
  string table_label = 4;
  int32 min_capacity = 5;
  int32 max_capacity = 6;
}

////////////////
message ScheduleRequest {
  string branch_id = 1;
  int32 day_of_week = 2; // 0-6 (Sunday to Saturday)
}

message ScheduleResponse {
  string open_time = 1;  // "HH:mm" format
  string close_time = 2; // "HH:mm" format
  bool closed = 3;
}

////////////////
message BranchDetailRequest {
  string branch_id = 1;
}

message BranchDetailResponse {
  string branch_id = 1;
  string restaurant_id = 2;
  string branch_name = 3;
  string branch_address = 4;
  string branch_phone = 5;
  string restaurant_name = 6;
  string restaurant_address = 7;
  string restaurant_phone = 8;
}