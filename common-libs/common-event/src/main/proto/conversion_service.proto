syntax = "proto3";

package com.tuttime.common.proto;

option java_multiple_files = true;
option java_package = "com.tuttime.common.proto";
option java_outer_classname = "ConversionServiceProto";

// Conversion Service gRPC
service ConversionService {
  rpc GetConversionInfo (GetConversionInfoRequest) returns (GetConversionInfoResponse);
  rpc GetUserConversions (GetUserConversionsRequest) returns (GetUserConversionsResponse);

  // Admin analytics endpoints
  rpc GetLastConversionSummary (GetLastConversionSummaryRequest) returns (GetLastConversionSummaryResponse);

  // Admin history endpoints
  rpc GetMonthlyConversionLedger (GetMonthlyConversionLedgerRequest) returns (GetMonthlyConversionLedgerResponse);
}

message GetConversionInfoRequest {
  int64 user_id = 1;
}

message GetConversionInfoResponse {
  string last_month_apart_conversion = 1; // Last month APART conversion amount
  string next_conversion_time = 2; // Next conversion time (ISO 8601 format)
  string this_month_forecast_amount = 3; // This month forecast amount (estimated tokens)
}

message GetUserConversionsRequest {
  int64 user_id = 1;
  int32 page = 2; // Page number (0-indexed)
  int32 size = 3; // Page size
}

message ConversionTask {
  int64 conversion_id = 1;
  int64 user_id = 2;
  string conversion_date = 3; // ISO 8601 date format
  string ap_credits = 4;
  string tokens = 5;
  string status = 6; // PENDING, PROCESSING, COMPLETED, FAILED
  string completed_at = 7; // ISO 8601 datetime format (optional)
}

message GetUserConversionsResponse {
  repeated ConversionTask conversions = 1;
  int32 total_pages = 2;
  int64 total_elements = 3;
  bool has_next = 4;
}

// Admin analytics messages
message GetLastConversionSummaryRequest {
  // Empty - gets summary for the most recent conversion
}

message GetLastConversionSummaryResponse {
  int64 total_users_count = 1; // Total users who participated
  string total_ap_amount = 2; // Total AP Credits converted
  string average_user_share = 3; // Average user share percentage
  string average_distributed_apart = 4; // Average APART tokens distributed per user
  string conversion_date = 5; // ISO 8601 datetime format
  int64 conversion_id = 6; // Conversion event ID
}

// Admin history messages
message GetMonthlyConversionLedgerRequest {
  int32 year = 1;
  int32 month = 2;
  int32 page = 3; // Page number (0-indexed)
  int32 size = 4; // Page size
}

message ConversionLedgerEntry {
  int64 user_id = 1;
  string username = 2;
  string ap_amount = 3; // AP Credits amount
  string user_share_percent = 4; // User share percentage (0-1)
  string distributed_apart_amount = 5; // Distributed APART amount
}

message GetMonthlyConversionLedgerResponse {
  repeated ConversionLedgerEntry entries = 1;
  int32 total_pages = 2;
  int64 total_elements = 3;
  bool has_next = 4;
}

