syntax = "proto3";

package com.tuttime.common.event.proto;

option java_multiple_files = true;
option java_package = "com.tuttime.common.event.proto";
option java_outer_classname = "PosServiceProto";

// Pos Service gRPC
service PosService {

  rpc PushToKitchen (KitchenOrderRequest) returns (KitchenOrderResponse);

  rpc GetPosHealth(GetPosHealthRequest) returns (GetPosHealthResponse);

}

// rpc pushToKitchen (PosOrderRequest) returns (PosOrderResponse);
message KitchenOrderRequest {
  string order_id = 1;
  string booking_id = 2;
  string branch_id = 3;
  repeated KitchenOrderItemRequest items = 7;
}

message KitchenOrderItemRequest {
  string menu_item_id = 1;
  string name = 2;
  int32 quantity = 3;
  string price = 4;
  repeated string modifiers = 5; // e.g., ["Medium Rare", "No Onions"]
}

message KitchenOrderResponse {
  bool success = 1;
  string pos_transaction_id = 2; // The ID generated by the restaurant's internal system
  string error_message = 3;
}

// rpc GetPosHealth(GetPosHealthRequest) returns (GetPosHealthResponse);
message GetPosHealthRequest {
  string branch_id = 1;
}

message GetPosHealthResponse {
  string last_sync_time = 1;      // ISO 8601 timestamp, empty if no data
  double success_rate = 2;
  int32 pending_orders = 3;
  double average_latency_ms = 4;
}