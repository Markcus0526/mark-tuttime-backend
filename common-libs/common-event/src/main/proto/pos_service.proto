syntax = "proto3";

import "google/protobuf/timestamp.proto";
package com.tuttime.common.proto;

option java_multiple_files = true;
option java_package = "com.tuttime.common.proto";
option java_outer_classname = "PosServiceProto";

// Pos Service gRPC
service PosService {
  rpc pushToKitchen (PosOrderRequest) returns (PosOrderResponse);

}

message PosOrderRequest {
  string order_id = 1;
  string booking_id = 2;
  string table_label = 3;
  string zone_name = 4;
  repeated PosOrderItem items = 5;
  string customer_name = 6;
}

message PosOrderItem {
  string menu_item_id = 1;
  string name = 2;
  int32 quantity = 3;
  double price = 4;
  repeated string modifiers = 5; // e.g., ["Medium Rare", "No Onions"]
}

message PosOrderResponse {
  bool success = 1;
  string pos_transaction_id = 2; // The ID generated by the restaurant's internal system
  string error_message = 3;
}