syntax = "proto3";

package com.tuttime.common.event.proto;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.tuttime.common.event.proto";
option java_outer_classname = "BookingServiceProto";

// Booking Service gRPC
service BookingService {

//  rpc StreamUpcomingBookings(BookingReminderRequest) returns (stream BookingReminderResponse);

}

// rpc StreamUpcomingBookings(BookingReminderRequest) returns (stream BookingReminderResponse);
message BookingReminderRequest {
  int32 lead_time_minutes = 1; // e.g., 120 for 2-hour reminders
}

message BookingReminderResponse {
  string booking_id = 1;
  string user_id = 2;
  string branch_name = 3;
  google.protobuf.Timestamp start_time = 4;
}