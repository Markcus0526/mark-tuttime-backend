syntax = "proto3";

import "google/protobuf/timestamp.proto";

package com.tuttime.common.proto;

option java_multiple_files = true;
option java_package = "com.tuttime.common.proto";
option java_outer_classname = "UserServiceProto";

// User Service gRPC
service UserService {
  // Synchronous call for Gateway and Services to validate a user
  rpc ValidateUserToken (ValidateUserRequest) returns (UserContextResponse);

  // Fetch basic profile info for display in Reviews/Bookings
  rpc GetUserProfile (UserByIdRequest) returns (UserProfileResponse);

  rpc GetUserById (UserByIdRequest) returns (UserResponse);

  rpc ValidateUserById (UserByIdRequest) returns (UserValidResponse);

}

// REQUESTS
message ValidateUserRequest {
  string jwt_token = 1;
}

message UserByIdRequest {
  string user_id = 1;
}

message UserContextResponse {
  string user_id = 1;
  string email = 2;
  string roles = 3;
  string status = 4;        // 'ACTIVE', 'INACTIVE', etc.
}

message UserProfileResponse {
  string id = 1;
  string phone_number = 2;
  string email = 3;
  string full_name = 4;
  string profile_picture = 5;
  string status = 7; // Mapping the 'user_status' enum to String
  string roles = 8;
  string auth_methods = 9;

  // Relationships
  double latitude = 11;           // Latitude for location-based features
  double longitude = 12;          // Longitude for location-based features

  google.protobuf.Timestamp last_login = 21;
  google.protobuf.Timestamp created_at = 22;
  google.protobuf.Timestamp updated_at = 23;
}

message UserResponse {
  string id = 1;
  string phone_number = 2;
  string email = 3;
  string full_name = 4;
  string status = 5;
  string roles = 6;

  // Relationships
  double latitude = 11;           // Latitude for location-based features
  double longitude = 12;          // Longitude for location-based features

  google.protobuf.Timestamp last_login = 21;
  google.protobuf.Timestamp created_at = 22;
  google.protobuf.Timestamp updated_at = 23;

}

message UserValidResponse {
  string roles = 1;
  bool is_valid = 2;
}