syntax = "proto3";

package com.tuttime.common.event.proto;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "com.tuttime.common.event.proto";
option java_outer_classname = "UserServiceProto";

// User Service gRPC
service UserService {
  // Synchronous call for Gateway and Services to validate a user
  rpc ValidateUserToken (TokenValidRequest) returns (ValidTokenResponse);

  // Fetch basic profile info for display in Reviews/Bookings
  rpc GetUserDetail (UserDetailRequest) returns (UserDetailResponse);

  rpc ValidateUser (UserValidRequest) returns (UserValidResponse);

  rpc GetUserDetails (UserDetailsRequest) returns (UserDetailsResponse);

  rpc DeleteDeviceToken(DeviceTokenDeleteRequest) returns (google.protobuf.Empty);

}

// rpc ValidateUserToken (TokenValidRequest) returns (ValidTokenResponse);
message TokenValidRequest {
  string jwt_token = 1;
}

message ValidTokenResponse {
  string user_id = 1;
  string email = 2;
  string roles = 3;
  string status = 4;        // 'ACTIVE', 'INACTIVE', etc.
}

// rpc GetUserDetail (UserDetailRequest) returns (UserDetailResponse);
message UserDetailRequest {
  string user_id = 1;
}

message UserDetailResponse {
  string user_id = 1;
  string phone_number = 2;
  string email = 3;
  string full_name = 4;
  string profile_picture = 5;
  string language = 6;
  string status = 7; // Mapping the 'user_status' enum to String
  string roles = 8;
  string auth_methods = 9;
  repeated string fcm_tokens = 10;

  // Relationships
  double latitude = 11;           // Latitude for location-based features
  double longitude = 12;          // Longitude for location-based features

  google.protobuf.Timestamp last_login = 21;
  google.protobuf.Timestamp created_at = 22;
  google.protobuf.Timestamp updated_at = 23;
}

// rpc ValidateUser (UserValidRequest) returns (UserValidResponse);
message UserValidRequest {
  string user_id = 1;
}

message UserValidResponse {
  string roles = 1;
  bool valid = 2;
}

// rpc GetUserDetails (UserDetailsRequest) returns (UserDetailsResponse);
message UserDetailsRequest {
  repeated string userIds = 1;
}

message UserDetailsResponse {
  repeated UserDetailResponse profiles = 1;
}

// rpc DeleteDeviceToken(DeviceTokenDeleteRequest) returns (google.protobuf.Empty);
message DeviceTokenDeleteRequest {
  string fcm_token = 1;
}