syntax = "proto3";

package com.tuttime.common.event.proto;

import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "com.tuttime.common.event.proto";
option java_outer_classname = "UserServiceProto";

// User Service gRPC
service UserService {

  rpc ValidateUserToken(ValidateUserTokenRequest) returns (ValidateUserTokenResponse);

  rpc GetUserDetail(GetUserDetailRequest) returns (GetUserDetailResponse);

  rpc ValidateUser(ValidateUserRequest) returns (ValidateUserResponse);

  rpc GetUserDetails(GetUserDetailsRequest) returns (GetUserDetailsResponse);

  rpc DeleteDeviceToken(DeleteDeviceTokenRequest) returns (google.protobuf.Empty);

}

// rpc ValidateUserToken(ValidateUserTokenRequest) returns (ValidateUserTokenResponse);
message ValidateUserTokenRequest {
  string jwt_token = 1;
}

message ValidateUserTokenResponse {
  string user_id = 1;
  string email = 2;
  string roles = 3;
  string status = 4;        // 'ACTIVE', 'INACTIVE', etc.
}

// rpc GetUserDetail(GetUserDetailRequest) returns (GetUserDetailResponse);
message GetUserDetailRequest {
  string user_id = 1;
}

message GetUserDetailResponse {
  string user_id = 1;
  string phone_number = 2;
  string email = 3;
  string full_name = 4;
  string profile_picture = 5;
  string language = 6;
  string status = 7; // Mapping the 'user_status' enum to String
  string roles = 8;
  string auth_methods = 9;
  repeated string fcm_tokens = 10;

  // Relationships
  double latitude = 11;           // Latitude for location-based features
  double longitude = 12;          // Longitude for location-based features

  string last_login = 21;
  string created_at = 22;
  string updated_at = 23;
}

// rpc ValidateUser(ValidateUserRequest) returns (ValidateUserResponse);
message ValidateUserRequest {
  string user_id = 1;
}

message ValidateUserResponse {
  string roles = 1;
  bool valid = 2;
}

// rpc GetUserDetails(GetUserDetailsRequest) returns (GetUserDetailsResponse);
message GetUserDetailsRequest {
  repeated string userIds = 1;
}

message GetUserDetailsResponse {
  repeated GetUserDetailResponse profiles = 1;
}

// rpc DeleteDeviceToken(DeleteDeviceTokenRequest) returns (google.protobuf.Empty);
message DeleteDeviceTokenRequest {
  string fcm_token = 1;
}