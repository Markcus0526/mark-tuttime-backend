spring:
  config:
    activate:
      on-profile: docker

  cloud:
    gateway:
      routes:
        # These variables will be resolved by the Docker network names
        USER_SERVICE: user-service
        RESTAURANT_SERVICE: restaurant-service
        MENU_SERVICE: menu-service
        BOOKING_SERVICE: booking-service
        ORDER_SERVICE: order-service
        PAYMENT_SERVICE: payment-service
        POS_SERVICE: pos-service
        REVIEW_SERVICE: review-service
        ANALYTICS_SERVICE: analytics-service
        NOTIFICATION_SERVICE: notification-service

  data:
    redis:
      host: ${REDIS_HOST:tuttime-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

security:
  jwt:
    secret: ${JWT_SECRET} # Do not hardcode, pass via .env
    issuer: ${JWT_ISSUER:tuttime-backend}

server:
  port: 8080

management:
  zipkin:
    tracing:
      endpoint: http://tuttime-zipkin:9411/api/v2/spans

graylog:
  host: ${GRAYLOG_HOST:tuttime-graylog}
  port: ${GRAYLOG_PORT:12201}