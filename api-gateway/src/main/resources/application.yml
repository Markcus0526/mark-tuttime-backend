            - name: CircuitBreaker
              args:
                name: notificationServiceCircuitBreaker
                fallbackUri: forward:/fallback/notification-service

        - id: notification-service-websocket
          order: 102
          uri: ws://${NOTIFICATION_SERVICE}
          predicates:
            - Path=/ws-notifications/**

        ################# OpenAPI(Swagger UI) Routes #######################
        - id: user-openapi
          uri: http://${USER_SERVICE}
          predicates:
            - Path=/user-docs/**
          filters:
            - RewritePath=/user-docs/(?<segment>.*), /${segment}

        - id: restaurant-openapi
          uri: http://${RESTAURANT_SERVICE}
          predicates:
            - Path=/restaurant-docs/**
          filters:
            - RewritePath=/restaurant-docs/(?<segment>.*), /${segment}

        - id: menu-openapi
          uri: http://${MENU_SERVICE}
          predicates:
            - Path=/menu-docs/**
          filters:
            - RewritePath=/menu-docs/(?<segment>.*), /${segment}

        - id: booking-openapi
          uri: http://${BOOKING_SERVICE}
          predicates:
            - Path=/booking-docs/**
          filters:
            - RewritePath=/booking-docs/(?<segment>.*), /${segment}

        - id: order-openapi
          uri: http://${ORDER_SERVICE}
          predicates:
            - Path=/order-docs/**
          filters:
            - RewritePath=/order-docs/(?<segment>.*), /${segment}

        - id: payment-openapi
          uri: http://${PAYMENT_SERVICE}
          predicates:
            - Path=/payment-docs/**
          filters:
            - RewritePath=/payment-docs/(?<segment>.*), /${segment}

        - id: pos-openapi
          uri: http://${POS_SERVICE}
          predicates:
            - Path=/pos-docs/**
          filters:
            - RewritePath=/pos-docs/(?<segment>.*), /${segment}

        - id: review-openapi
          uri: http://${REVIEW_SERVICE}
          predicates:
            - Path=/review-docs/**
          filters:
            - RewritePath=/review-docs/(?<segment>.*), /${segment}

        - id: analytics-openapi
          uri: http://${ANALYTICS_SERVICE}
          predicates:
            - Path=/analytics-docs/**
          filters:
            - RewritePath=/analytics-docs/(?<segment>.*), /${segment}

        - id: notification-openapi
          uri: http://${NOTIFICATION_SERVICE}
          predicates:
            - Path=/notification-docs/**
          filters:
            - RewritePath=/notification-docs/(?<segment>.*), /${segment}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: gateway-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER}
      audience: ${JWT_AUDIENCE}

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT}
  shutdown: graceful

grpc:
  server:
    port: ${GRPC_PORT}
  client:
    user-service:
      address: static://${USER_GRPC_SERVICE}
      negotiation-type: plaintext
    restaurant-service:
      address: static://${RESTAURANT_GRPC_SERVICE}
      negotiation-type: plaintext
    booking-service:
      address: static://${BOOKING_GRPC_SERVICE}
      negotiation-type: plaintext
    order-service:
      address: static://${ORDER_GRPC_SERVICE}
      negotiation-type: plaintext
    payment-service:
      address: static://${PAYMENT_GRPC_SERVICE}
      negotiation-type: plaintext
    pos-service:
      address: static://${POS_GRPC_SERVICE}
      negotiation-type: plaintext
    review-service:
      address: static://${REVIEW_GRPC_SERVICE}
      negotiation-type: plaintext
    analytics-service:
      address: static://${ANALYTICS_GRPC_SERVICE}
      negotiation-type: plaintext
    notification-service:
      address: static://${NOTIFICATION_GRPC_SERVICE}
      negotiation-type: plaintext
  security:
    enabled: false
  client-deadline-seconds: ${GRPC_CLIENT_DEADLINE_SECONDS}

resilience4j:
  circuitbreaker:
    instances:
      grpc:
        registerHealthIndicator: true
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        recordExceptions:
          - io.grpc.StatusRuntimeException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
          - java.net.ConnectException
  timelimiter:
    instances:
      grpc:
        timeoutDuration: ${CIRCUIT_BREAKER_TIMEOUT:305s} # Ensure this is > GRPC_CLIENT_DEADLINE_SECONDS!
        cancelRunningFuture: true
  retry:
    instances:
      grpc:
        maxAttempts: 3
        waitDuration: 1s
        retryExceptions:
          - io.grpc.StatusRuntimeException
          - java.util.concurrent.TimeoutException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.tuttime: DEBUG
    org.springframework.cloud.gateway: INFO

graylog:
  host: ${GRAYLOG_HOST}
  port: ${GRAYLOG_PORT}
  origin-host: ${GRAYLOG_ORIGIN_HOST}
  facility: ${GRAYLOG_FACILITY:api-gateway}
  include-source: ${GRAYLOG_INCLUDE_SOURCE:true}
  maximum-message-size: ${GRAYLOG_MAX_MESSAGE_SIZE:8192}
  compression-type: ${GRAYLOG_COMPRESSION_TYPE:GZIP}

rate:
  limit:
    authenticated:
      capacity: ${RATE_LIMIT_AUTHENTICATED_CAPACITY:500}
      refill:
        period:
          minutes: 1

springdoc:
  cache:
    disabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    urls:
      - name: User Service
        url: /user-docs/v3/api-docs
      - name: Restaurant Service
        url: /restaurant-docs/v3/api-docs
      - name: Menu Service
        url: /menu-docs/v3/api-docs
      - name: Booking Service
        url: /booking-docs/v3/api-docs
      - name: Order Service
        url: /order-docs/v3/api-docs
      - name: Payment Service
        url: /payment-docs/v3/api-docs
      - name: Pos Service
        url: /pos-docs/v3/api-docs
      - name: Review Service
        url: /review-docs/v3/api-docs
      - name: Analytics Service
        url: /analytics-docs/v3/api-docs
      - name: Notification Service
        url: /notification-docs/v3/api-docs

  writer-with-default-pretty-printer: true
  use-fqn: true # Uses Fully Qualified Names to prevent collisions

