spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  main:
    web-application-type: reactive

  codec:
    max-in-memory-size: ${SPRING_CODEC_MAX_IN_MEMORY_SIZE:500MB}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:5000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE}
          max-idle: ${REDIS_POOL_MAX_IDLE}
          min-idle: ${REDIS_POOL_MIN_IDLE}

  cloud:
    kubernetes:
      discovery:
        enabled: ${SPRING_CLOUD_KUBERNETES_DISCOVERY_ENABLED:false}
      config:
        enabled: ${SPRING_CLOUD_KUBERNETES_CONFIG_ENABLED:false}

    gateway:
      httpclient:
        max-header-size: 16KB
        max-keep-alive-time: ${GATEWAY_HTTP_KEEP_ALIVE:3600s}
        connect-timeout: ${GATEWAY_HTTP_CONNECT_TIMEOUT:60000}
        response-timeout: ${GATEWAY_HTTP_RESPONSE_TIMEOUT:300s}
        pool:
          max-connections: ${GATEWAY_POOL_MAX_CONNECTIONS:5000}

      routes:
        ################# User Service Routes #######################
        # Auth Service Routes (consolidated route with filters)
        - id: user-service-auth
          order: 11
          uri: http://${USER_SERVICE}
          predicates:
            - Path=/api/v1/auth/**
            - Method=POST,GET,OPTIONS
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service

        # User Service Routes (GENERAL - comes after specific routes)
        - id: user-service-user
          order: 12
          uri: http://${USER_SERVICE}
          predicates:
            - Path=/api/v1/users/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service

        # User Service - App Version Routes
        - id: user-service-app-version
          order: 13
          uri: http://${USER_SERVICE}
          predicates:
            - Path=/api/v1/app/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service

        - id: user-service-media-files
          order: 14
          uri: http://${USER_SERVICE}
          predicates:
            - Path=/user-medias/**
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service

        ################# Restaurant Service Routes #######################
        - id: restaurant-service-restaurant
          order: 21
          uri: http://${RESTAURANT_SERVICE}
          predicates:
            - Path=/api/v1/restaurants/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: restaurantServiceCircuitBreaker
                fallbackUri: forward:/fallback/restaurant-service

        - id: restaurant-service-branch
          order: 22
          uri: http://${RESTAURANT_SERVICE}
          predicates:
            - Path=/api/v1/restaurant-branches/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: restaurantServiceCircuitBreaker
                fallbackUri: forward:/fallback/restaurant-service

        - id: restaurant-service-zone
