spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  main:
    web-application-type: reactive

  codec:
    max-in-memory-size: ${SPRING_CODEC_MAX_IN_MEMORY_SIZE:500MB}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:5000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE}
          max-idle: ${REDIS_POOL_MAX_IDLE}
          min-idle: ${REDIS_POOL_MIN_IDLE}

  cloud:
    kubernetes:
      discovery:
        enabled: ${SPRING_CLOUD_KUBERNETES_DISCOVERY_ENABLED:false}
      config:
        enabled: ${SPRING_CLOUD_KUBERNETES_CONFIG_ENABLED:false}

    gateway:
      httpclient:
        max-header-size: 16KB
        max-keep-alive-time: ${GATEWAY_HTTP_KEEP_ALIVE:3600s}
        connect-timeout: ${GATEWAY_HTTP_CONNECT_TIMEOUT:10s}
        response-timeout: ${GATEWAY_HTTP_RESPONSE_TIMEOUT:30s}
        pool:
          max-connections: ${GATEWAY_POOL_MAX_CONNECTIONS:5000}

      # ----------------------------------------------
      # Global default filters (applied to all routes)
      # ----------------------------------------------
      default-filters:
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@userKeyResolver}"
            redis-rate-limiter.replenishRate: 50
            redis-rate-limiter.burstCapacity: 100
        - name: Retry
          args:
            retries: 3
            statuses: SERVICE_UNAVAILABLE,INTERNAL_SERVER_ERROR
            methods: GET
            exceptions:
              - java.net.ConnectException
              - java.net.SocketTimeoutException
              - java.net.UnknownHostException
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=X-Frame-Options, DENY
        - AddResponseHeader=X-XSS-Protection, 1; mode=block
        - AddResponseHeader=Referrer-Policy, no-referrer

      # ----------------------------------------------
      # Route definitions
      # ----------------------------------------------
      routes:
        # ---------- User Service ----------
        - id: user-service-auth
          uri: http://${USER_SERVICE}
          predicates:
            - Path=/api/v1/auth/**
            - Method=POST,GET,OPTIONS
          filters:
            - name: BruteForceProtection           # only on auth (before rate limit)
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service

        - id: user-service-user
          uri: http://${USER_SERVICE}
          predicates:
            - Path=/api/v1/users/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service

        - id: user-service-media-direct
          uri: http://${USER_SERVICE}
          predicates:
            - Path=/user-medias/**
          filters:
            - name: JwtAuthentication               # optional: media may be public
            - name: Retry                           # keep retry for static assets
              args:
                retries: 2
                statuses: SERVICE_UNAVAILABLE
                methods: GET

        # ---------- Restaurant Service ----------
        - id: restaurant-service
          uri: http://${RESTAURANT_SERVICE}
          predicates:
            - Path=/api/v1/restaurants/**,/api/v1/restaurant-branches/**,/api/v1/restaurant-zones/**,/api/v1/restaurant-tables/**,/api/v1/restaurant-schedules/**,/api/v1/restaurant-medias/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: restaurantServiceCircuitBreaker
                fallbackUri: forward:/fallback/restaurant-service

        - id: restaurant-service-media-direct
          uri: http://${RESTAURANT_SERVICE}
          predicates:
            - Path=/restaurant-medias/**
          filters:
            - name: JwtAuthentication               # optional

        # ---------- Menu Service ----------
        - id: menu-service
          uri: http://${MENU_SERVICE}
          predicates:
            - Path=/api/v1/menus/**,/api/v1/menu-items/**,/api/v1/menu-modifiers/**,/api/v1/menu-discounts/**,/api/v1/menu-stoplists/**,/api/v1/menu-medias/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: menuServiceCircuitBreaker
                fallbackUri: forward:/fallback/menu-service

        - id: menu-service-media-direct
          uri: http://${MENU_SERVICE}
          predicates:
            - Path=/menu-medias/**

        # ---------- Booking Service ----------
        - id: booking-service
          uri: http://${BOOKING_SERVICE}
          predicates:
            - Path=/api/v1/bookings/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: bookingServiceCircuitBreaker
                fallbackUri: forward:/fallback/booking-service

        # ---------- Order Service ----------
        - id: order-service
          uri: http://${ORDER_SERVICE}
          predicates:
            - Path=/api/v1/orders/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: orderServiceCircuitBreaker
                fallbackUri: forward:/fallback/order-service

        # ---------- Payment Service ----------
        - id: payment-service
          uri: http://${PAYMENT_SERVICE}
          predicates:
            - Path=/api/v1/payments/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: paymentServiceCircuitBreaker
                fallbackUri: forward:/fallback/payment-service

        # ---------- POS Service ----------
        - id: pos-service
          uri: http://${POS_SERVICE}
          predicates:
            - Path=/api/v1/poses/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: posServiceCircuitBreaker
                fallbackUri: forward:/fallback/pos-service

        # ---------- Review Service ----------
        - id: review-service
          uri: http://${REVIEW_SERVICE}
          predicates:
            - Path=/api/v1/reviews/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: reviewServiceCircuitBreaker
                fallbackUri: forward:/fallback/review-service

        # ---------- Analytics Service ----------
        - id: analytics-service
          uri: http://${ANALYTICS_SERVICE}
          predicates:
            - Path=/api/v1/analytics/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: analyticsServiceCircuitBreaker
                fallbackUri: forward:/fallback/analytics-service

        # ---------- Notification Service ----------
        - id: notification-service
          uri: http://${NOTIFICATION_SERVICE}
          predicates:
            - Path=/api/v1/notifications/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: notificationServiceCircuitBreaker
                fallbackUri: forward:/fallback/notification-service

        - id: notification-service-websocket
          uri: ws://${NOTIFICATION_SERVICE}
          predicates:
            - Path=/ws-notifications/**

        # ---------- OpenAPI (Swagger) – no JWT authentication ----------
        - id: user-openapi
          uri: http://${USER_SERVICE}
          predicates:
            - Path=/user-docs/**
            - Method=GET
          filters:
            - RewritePath=/user-docs/(?<segment>.*), /${segment}

        - id: restaurant-openapi
          uri: http://${RESTAURANT_SERVICE}
          predicates:
            - Path=/restaurant-docs/**
            - Method=GET
          filters:
            - RewritePath=/restaurant-docs/(?<segment>.*), /${segment}

        - id: menu-openapi
          uri: http://${MENU_SERVICE}
          predicates:
            - Path=/menu-docs/**
            - Method=GET
          filters:
            - RewritePath=/menu-docs/(?<segment>.*), /${segment}

        - id: booking-openapi
          uri: http://${BOOKING_SERVICE}
          predicates:
            - Path=/booking-docs/**
            - Method=GET
          filters:
            - RewritePath=/booking-docs/(?<segment>.*), /${segment}

        - id: order-openapi
          uri: http://${ORDER_SERVICE}
          predicates:
            - Path=/order-docs/**
            - Method=GET
          filters:
            - RewritePath=/order-docs/(?<segment>.*), /${segment}

        - id: payment-openapi
          uri: http://${PAYMENT_SERVICE}
          predicates:
            - Path=/payment-docs/**
            - Method=GET
          filters:
            - RewritePath=/payment-docs/(?<segment>.*), /${segment}

        - id: pos-openapi
          uri: http://${POS_SERVICE}
          predicates:
            - Path=/pos-docs/**
            - Method=GET
          filters:
            - RewritePath=/pos-docs/(?<segment>.*), /${segment}

        - id: review-openapi
          uri: http://${REVIEW_SERVICE}
          predicates:
            - Path=/review-docs/**
            - Method=GET
          filters:
            - RewritePath=/review-docs/(?<segment>.*), /${segment}

        - id: analytics-openapi
          uri: http://${ANALYTICS_SERVICE}
          predicates:
            - Path=/analytics-docs/**
            - Method=GET
          filters:
            - RewritePath=/analytics-docs/(?<segment>.*), /${segment}

        - id: notification-openapi
          uri: http://${NOTIFICATION_SERVICE}
          predicates:
            - Path=/notification-docs/**
            - Method=GET
          filters:
            - RewritePath=/notification-docs/(?<segment>.*), /${segment}

        # ---------- Fallback for unmatched routes ----------
        - id: not-found
          uri: ${GATEWAY_FALLBACK_URI:forward:/404}
          predicates:
            - Path=/**
          filters:
            - name: SetStatus
              args:
                status: 404

    loadbalancer:
      enabled: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: gateway-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER}
      audience: ${JWT_AUDIENCE}

  threads:
    virtual:
      enabled: true

  aop:
    proxy-target-class: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}

server:
  port: ${SERVER_PORT}
  shutdown: graceful

jwt:
  redis-timeout-ms: 2000

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 30
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 80
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 10s
        recordExceptions:
          # - org.springframework.web.server.ResponseStatusException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
          - java.net.ConnectException
    instances:
      userServiceCircuitBreaker:
        baseConfig: default
      restaurantServiceCircuitBreaker:
        baseConfig: default
      menuServiceCircuitBreaker:
        baseConfig: default
      bookingServiceCircuitBreaker:
        baseConfig: default
      orderServiceCircuitBreaker:
        baseConfig: default
      paymentServiceCircuitBreaker:
        baseConfig: default
      posServiceCircuitBreaker:
        baseConfig: default
      reviewServiceCircuitBreaker:
        baseConfig: default
      analyticsServiceCircuitBreaker:
        baseConfig: default
      notificationServiceCircuitBreaker:
        baseConfig: default

  timelimiter:
    instances:
      userServiceCircuitBreaker:
        timeoutDuration: 60s
        cancelRunningFuture: true
      restaurantServiceCircuitBreaker:
        timeoutDuration: 60s
        cancelRunningFuture: true
      menuServiceCircuitBreaker:
        timeoutDuration: 60s
        cancelRunningFuture: true
      bookingServiceCircuitBreaker:
        timeoutDuration: 60s
        cancelRunningFuture: true
      orderServiceCircuitBreaker:
        timeoutDuration: 60s
        cancelRunningFuture: true
      paymentServiceCircuitBreaker:
        timeoutDuration: 60s
        cancelRunningFuture: true
      posServiceCircuitBreaker:
        timeoutDuration: 60s
        cancelRunningFuture: true
      reviewServiceCircuitBreaker:
        timeoutDuration: 60s
        cancelRunningFuture: true
      analyticsServiceCircuitBreaker:
        timeoutDuration: 60s
        cancelRunningFuture: true
      notificationServiceCircuitBreaker:
        timeoutDuration: 60s
        cancelRunningFuture: true

  #retry:
    # instances:
      #grpc:
      #  maxAttempts: 3
      #  waitDuration: 1s
      #  retryExceptions:
      #    - io.grpc.StatusRuntimeException
      #    - java.util.concurrent.TimeoutException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.tuttime: DEBUG
    org.springframework.boot.autoconfigure: DEBUG
    org.springframework.cloud.gateway: INFO
    io.github.resilience4j.circuitbreaker: DEBUG

graylog:
  host: ${GRAYLOG_HOST}
  port: ${GRAYLOG_PORT}
  origin-host: ${GRAYLOG_ORIGIN_HOST}
  facility: ${GRAYLOG_FACILITY:api-gateway}
  include-source: ${GRAYLOG_INCLUDE_SOURCE:true}
  maximum-message-size: ${GRAYLOG_MAX_MESSAGE_SIZE:8192}
  compression-type: ${GRAYLOG_COMPRESSION_TYPE:GZIP}

rate:
  limit:
    authenticated:
      refill:
        period:
          minutes: 1

springdoc:
  cache:
    disabled: true
  swagger-ui:
    path: /swagger-ui.html
    config-url: /v3/api-docs
    operations-sorter: alpha
    tags-sorter: alpha
    urls:
      - name: User Service
        url: /user-docs/v3/api-docs
      - name: Restaurant Service
        url: /restaurant-docs/v3/api-docs
      - name: Menu Service
        url: /menu-docs/v3/api-docs
      - name: Booking Service
        url: /booking-docs/v3/api-docs
      - name: Order Service
        url: /order-docs/v3/api-docs
      - name: Payment Service
        url: /payment-docs/v3/api-docs
      - name: Pos Service
        url: /pos-docs/v3/api-docs
      - name: Review Service
        url: /review-docs/v3/api-docs
      - name: Analytics Service
        url: /analytics-docs/v3/api-docs
      - name: Notification Service
        url: /notification-docs/v3/api-docs

  writer-with-default-pretty-printer: true
  use-fqn: true # Uses Fully Qualified Names to prevent collisions

