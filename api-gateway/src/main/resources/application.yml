                fallbackUri: forward:/fallback/menu-service

        - id: menu-service-discount
          order: 34
          uri: http://${MENU_SERVICE}
          predicates:
            - Path=/api/v1/menu-discounts/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: menuServiceCircuitBreaker
                fallbackUri: forward:/fallback/menu-service

        - id: menu-service-stoplist
          order: 35
          uri: http://${MENU_SERVICE}
          predicates:
            - Path=/api/v1/menu-stoplists/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: menuServiceCircuitBreaker
                fallbackUri: forward:/fallback/menu-service

        - id: menu-service-media
          order: 36
          uri: http://${MENU_SERVICE}
          predicates:
            - Path=/api/v1/menu-medias/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: menuServiceCircuitBreaker
                fallbackUri: forward:/fallback/menu-service

        - id: menu-service-media-files
          order: 37
          uri: http://${MENU_SERVICE}
          predicates:
            - Path=/menu-medias/**
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: menuServiceCircuitBreaker
                fallbackUri: forward:/fallback/menu-service

        ################# Booking Service Routes #######################

        - id: booking-service-booking
          order: 41
          uri: http://${BOOKING_SERVICE}
          predicates:
            - Path=/api/v1/bookings/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: bookingServiceCircuitBreaker
                fallbackUri: forward:/fallback/booking-service

        ################# Order Service Routes #######################

        - id: order-service-order
          order: 51
          uri: http://${ORDER_SERVICE}
          predicates:
            - Path=/api/v1/orders/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: orderServiceCircuitBreaker
                fallbackUri: forward:/fallback/order-service

        ################# Payment Service Routes #######################

        - id: payment-service-payment
          order: 61
          uri: http://${PAYMENT_SERVICE}
          predicates:
            - Path=/api/v1/payments/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: paymentServiceCircuitBreaker
                fallbackUri: forward:/fallback/payment-service

        ################# Pos Service Routes #######################

        - id: pos-service-pos
          order: 71
          uri: http://${POS_SERVICE}
          predicates:
            - Path=/api/v1/poses/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: posServiceCircuitBreaker
                fallbackUri: forward:/fallback/pos-service

        ################# Review Service Routes #######################

        - id: review-service-review
          order: 81
          uri: http://${REVIEW_SERVICE}
          predicates:
            - Path=/api/v1/reviews/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: reviewServiceCircuitBreaker
                fallbackUri: forward:/fallback/review-service

        ################# Analytics Service Routes #######################

        - id: analytics-service-analytics
          order: 91
          uri: http://${ANALYTICS_SERVICE}
          predicates:
            - Path=/api/v1/analytics/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
