spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  main:
    web-application-type: reactive
  codec:
    max-in-memory-size: 500MB  # Increase max body size for large file uploads (videos)
  cloud:
    # Kubernetes Config (for ConfigMap support) - Discovery not needed (using direct URLs)
    kubernetes:
      discovery:
        enabled: false  # Not needed - using direct URLs with Kubernetes DNS
      config:
        enabled: ${SPRING_CLOUD_KUBERNETES_CONFIG_ENABLED:false}
    gateway:
      httpclient:
        max-header-size: 16KB
        max-keep-alive-time: 3600s  # 1 hour for WebSocket connections (server timeout)
        connect-timeout: 60000  # 60 seconds connection timeout
        response-timeout: 300s  # 5 minutes for HTTP requests (WebSocket uses different timeout mechanism)
        pool:
          max-idle-time: 0
          max-connections: 5000  # Increased to 5000 for 100M user scale (12 pods × 5000 = 60k capacity, can scale to 30 pods × 5000 = 150k)
          eviction-interval: 30s
      # Discovery locator disabled - using direct URLs instead of lb:// URIs
      # Kubernetes Service provides automatic load balancing
      discovery:
        locator:
          enabled: false
      routes:
        ################# User Service Routes #######################

        # Auth Service Routes (consolidated route with filters)
        # Endpoints include: /api/v1/auth/**
        - id: user-service-auth
          order: 11
          uri: http://${USER_SERVICE:localhost}:${USER_SERVICE_PORT:28001}
          predicates:
            - Path=/api/v1/auth/**
            - Method=POST,GET,OPTION
          filters:
            # Temporarily comment out custom filters to debug routing issue
            # - name: RateLimiting
            # - name: BruteForceProtection
            # - name: JwtAuthentication
            #   args:
            #     skipPaths: /api/v1/auth/register,/api/v1/auth/register/refresh-token,/api/v1/auth/register/phone/verify,/api/v1/auth/register/send-code,/api/v1/auth/register/password-reset/request,/api/v1/auth/register/password-reset/confirm,/api/v1/auth/register/oauth-login,/api/v1/auth/register/email/send-verification,/api/v1/auth/register/email/verify
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service

        # User Service Routes (GENERAL - comes after specific routes)
        # Endpoints include: /api/v1/users/**
        - id: user-service-user
          order: 12
          uri: http://${USER_SERVICE:localhost}:${USER_SERVICE_PORT:28001}
          predicates:
            - Path=/api/v1/users/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTION
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service

        # User Service - App Version Routes
        # Endpoints include: /api/v1/app/**
        - id: user-service-app-version
          order: 13
          uri: http://${USER_SERVICE:localhost}:${USER_SERVICE_PORT:28001}
          predicates:
            - Path=/api/v1/app/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTION
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service

        ################# Restaurant Service Routes #######################

        # Methods: GET, POST, PUT, PATCH, DELETE
        # Endpoints include: /api/v1/restaurants/**
        - id: restaurant-service-restaurant
          order: 21
          uri: http://${RESTAURANT_SERVICE:localhost}:${RESTAURANT_SERVICE_PORT:28002}
          predicates:
            - Path=/api/v1/restaurants/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTION
