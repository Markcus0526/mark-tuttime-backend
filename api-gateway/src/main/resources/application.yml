          predicates:
            - Path=/api/v1/restaurant-schedules/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: restaurantServiceCircuitBreaker
                fallbackUri: forward:/fallback/restaurant-service

        - id: restaurant-service-media
          order: 26
          uri: http://${RESTAURANT_SERVICE}
          predicates:
            - Path=/api/v1/restaurant-medias/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: restaurantServiceCircuitBreaker
                fallbackUri: forward:/fallback/restaurant-service

        - id: restaurant-service-media-files
          order: 27
          uri: http://${RESTAURANT_SERVICE}
          predicates:
            - Path=/restaurant-medias/**
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: restaurantServiceCircuitBreaker
                fallbackUri: forward:/fallback/restaurant-service

        ################# Menu Service Routes #######################

        - id: menu-service-menu
          order: 31
          uri: http://${MENU_SERVICE}
          predicates:
            - Path=/api/v1/menus/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: menuServiceCircuitBreaker
                fallbackUri: forward:/fallback/menu-service

        - id: menu-service-item
          order: 32
          uri: http://${MENU_SERVICE}
          predicates:
            - Path=/api/v1/menu-items/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: menuServiceCircuitBreaker
                fallbackUri: forward:/fallback/menu-service

        - id: menu-service-modifier
          order: 33
          uri: http://${MENU_SERVICE}
          predicates:
            - Path=/api/v1/menu-modifiers/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
