spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  main:
    web-application-type: reactive

  codec:
    max-in-memory-size: ${SPRING_CODEC_MAX_IN_MEMORY_SIZE:500MB}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:5000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE}
          max-idle: ${REDIS_POOL_MAX_IDLE}
          min-idle: ${REDIS_POOL_MIN_IDLE}

  cloud:
    kubernetes:
      discovery:
        enabled: ${SPRING_CLOUD_KUBERNETES_DISCOVERY_ENABLED:false}
      config:
        enabled: ${SPRING_CLOUD_KUBERNETES_CONFIG_ENABLED:false}

    gateway:
      httpclient:
        max-header-size: 16KB
        max-keep-alive-time: ${GATEWAY_HTTP_KEEP_ALIVE:3600s}
        connect-timeout: ${GATEWAY_HTTP_CONNECT_TIMEOUT:10s}
        response-timeout: ${GATEWAY_HTTP_RESPONSE_TIMEOUT:30s}
        pool:
          max-connections: ${GATEWAY_POOL_MAX_CONNECTIONS:5000}

      default-filters:
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=X-Frame-Options, DENY
        - AddResponseHeader=X-XSS-Protection, 1; mode=block
        - AddResponseHeader=Referrer-Policy, no-referrer

      #grpc:
      #  enabled: false

      routes:
        ################# User Service Routes #######################
        # Auth Service Routes (consolidated route with filters)
        - id: user-service-auth
          order: 11
          uri: http://${USER_SERVICE}
          predicates:
            - Path=/api/v1/auth/**
            - Method=POST,GET,OPTIONS
          filters:
            - name: BruteForceProtection
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
            - name: Retry
              args:
                retries: 3
                statuses: SERVICE_UNAVAILABLE,INTERNAL_SERVER_ERROR
                methods: GET,POST
                exceptions:
                  - java.net.ConnectException
                  - java.net.SocketTimeoutException
                  - java.net.UnknownHostException
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service

        # User Service Routes (GENERAL - comes after specific routes)
        - id: user-service-user
          order: 12
          uri: http://${USER_SERVICE}
          predicates:
            - Path=/api/v1/users/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 10
