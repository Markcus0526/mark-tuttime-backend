spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  main:
    web-application-type: reactive

  codec:
    max-in-memory-size: ${SPRING_CODEC_MAX_IN_MEMORY_SIZE:500MB}

  cache:
    type: redis
  data:
    redis:
      sentinel:
        master: ${SPRING_DATA_REDIS_SENTINEL_MASTER:tuttime-redis-master}
        nodes:
          - ${SPRING_DATA_REDIS_SENTINEL_NODE_1:}
          - ${SPRING_DATA_REDIS_SENTINEL_NODE_2:}
          - ${SPRING_DATA_REDIS_SENTINEL_NODE_3:}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:5s}
      lettuce:
        pool:
          max-active: ${SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE:20}
          max-idle: ${SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE:10}
          min-idle: ${SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE:2}
          max-wait: -1ms

  cloud:
    kubernetes:
      discovery:
        enabled: ${SPRING_CLOUD_KUBERNETES_DISCOVERY_ENABLED:false}
      config:
        enabled: ${SPRING_CLOUD_KUBERNETES_CONFIG_ENABLED:false}

    gateway:
      httpclient:
        max-header-size: 16KB
        max-keep-alive-time: ${GATEWAY_HTTP_KEEP_ALIVE:3600s}
        connect-timeout: ${GATEWAY_HTTP_CONNECT_TIMEOUT:10s}
        response-timeout: ${GATEWAY_HTTP_RESPONSE_TIMEOUT:30s}
        pool:
          max-connections: ${GATEWAY_POOL_MAX_CONNECTIONS:5000}

      # -------------------------------------------------------------
      # GLOBAL CORS CONFIGURATION FOR Httponly CREDENTIALS
      # -------------------------------------------------------------
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true # Allows browser to send the HttpOnly cookies

      # ----------------------------------------------
      # Global default filters (applied to all routes)
      # ----------------------------------------------
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
        - name: Retry
          args:
            retries: 3
            statuses: SERVICE_UNAVAILABLE
            methods: GET
            exceptions:
              - java.net.ConnectException
              - java.net.UnknownHostException
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=X-Frame-Options, DENY
        - AddResponseHeader=X-XSS-Protection, 1; mode=block
        - AddResponseHeader=Referrer-Policy, no-referrer
        - AddRequestHeader=X-Internal-Gateway-Token, ${CLUSTER_INTERNAL_SECRET:***REMOVED***}
        # Redis token-bucket rate limiting (keyed by X-User-Id, falls back to client IP via userKeyResolver)
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:50}
            redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:100}
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@userKeyResolver}"


      # ----------------------------------------------
      # Route definitions
      # ----------------------------------------------
      routes:
        # =================================================================
        # ZERO-FILTER ISOLATED SAFETY CUTOFF FOR CIRCUIT BREAKER FALLBACKS
        # =================================================================
        - id: gateway-fallback-safety
          uri: forward:/  # Terminates routing loops inside the Gateway context
          predicates:
            - Path=/fallback/**
          order: -200 # HIGHEST PRIORITY: Must execute before any microservice rules
          filters:
            - name: SecureHeaders

        # =================================================================
        # 1. HIGH-PRIORITY RAW MEDIA ENDPOINTS (Executed First, No Filters)
        # =================================================================
        - id: user-service-media-direct
          uri: http://${USER_SERVICE}
          predicates:
            - Path=/user-medias/**
          order: -100
          filters:
            - name: SecureHeaders
          metadata:
            response-timeout: 30000
            connect-timeout: 10000

        - id: restaurant-service-media-direct
          uri: http://${RESTAURANT_SERVICE}
          predicates:
            - Path=/restaurant-medias/**
          order: -100
          metadata:
            response-timeout: 30000
            connect-timeout: 10000

        - id: menu-service-media-direct
          uri: http://${MENU_SERVICE}
          predicates:
            - Path=/menu-medias/**
          order: -100
          metadata:
            response-timeout: 30000
            connect-timeout: 10000

        # =================================================================
        # 2. SECURE REST API ROUTES (Explicitly Isolated from Media paths)
        # =================================================================
        # ---------- User Service ----------
        - id: user-service-auth
          uri: http://${USER_SERVICE}
          predicates:
            - Path=/api/v1/auth/**
            - Method=POST,GET,OPTIONS
          filters:
            - name: BruteForceProtection           # only on auth (before rate limit)
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker

        - id: user-service-user
          uri: http://${USER_SERVICE}
          predicates:
            - Path=/api/v1/users/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service

        # ---------- Restaurant Service ----------
        - id: restaurant-service
          uri: http://${RESTAURANT_SERVICE}
          predicates:
            - Path=/api/v1/restaurants/**,/api/v1/restaurant-branches/**,/api/v1/restaurant-zones/**,/api/v1/restaurant-tables/**,/api/v1/restaurant-schedules/**,/api/v1/restaurant-medias/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: restaurantServiceCircuitBreaker
                fallbackUri: forward:/fallback/restaurant-service

        # ---------- Menu Service ----------
        - id: menu-service
          uri: http://${MENU_SERVICE}
          predicates:
            - Path=/api/v1/menus/**,/api/v1/menu-items/**,/api/v1/menu-modifiers/**,/api/v1/menu-discounts/**,/api/v1/menu-stoplists/**,/api/v1/menu-medias/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: menuServiceCircuitBreaker
                fallbackUri: forward:/fallback/menu-service

        # ---------- Booking Service ----------
        - id: booking-service
          uri: http://${BOOKING_SERVICE}
          predicates:
            - Path=/api/v1/bookings/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: bookingServiceCircuitBreaker
                fallbackUri: forward:/fallback/booking-service

        # ---------- Order Service ----------
        - id: order-service
          uri: http://${ORDER_SERVICE}
          predicates:
            - Path=/api/v1/orders/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: orderServiceCircuitBreaker
                fallbackUri: forward:/fallback/order-service

        # ---------- Payment Service ----------
        - id: payment-service
          uri: http://${PAYMENT_SERVICE}
          predicates:
            - Path=/api/v1/payments/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: paymentServiceCircuitBreaker
                fallbackUri: forward:/fallback/payment-service

        # ---------- POS Service ----------
        - id: pos-service
          uri: http://${POS_SERVICE}
          predicates:
            - Path=/api/v1/poses/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: posServiceCircuitBreaker
                fallbackUri: forward:/fallback/pos-service

        # ---------- Review Service ----------
        - id: review-service
          uri: http://${REVIEW_SERVICE}
          predicates:
            - Path=/api/v1/reviews/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: reviewServiceCircuitBreaker
                fallbackUri: forward:/fallback/review-service

        # ---------- Analytics Service ----------
        - id: analytics-service
          uri: http://${ANALYTICS_SERVICE}
          predicates:
            - Path=/api/v1/analytics/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: analyticsServiceCircuitBreaker
                fallbackUri: forward:/fallback/analytics-service

        # ---------- Notification Service ----------
        - id: notification-service
          uri: http://${NOTIFICATION_SERVICE}
          predicates:
            - Path=/api/v1/notifications/**
            - Method=GET,POST,PUT,PATCH,DELETE,OPTIONS
          filters:
            - name: JwtAuthentication
            - name: CircuitBreaker
              args:
                name: notificationServiceCircuitBreaker
                fallbackUri: forward:/fallback/notification-service

        - id: notification-service-websocket
          uri: ws://${NOTIFICATION_SERVICE}
          predicates:
            - Path=/ws-notifications/**
          filters:
            - name: JwtAuthentication

        # ---------- OpenAPI (Swagger) – no JWT authentication ----------
        - id: user-openapi
          uri: http://${USER_SERVICE}
          predicates:
            - Path=/user-docs/**
            - Method=GET
          filters:
            - RewritePath=/user-docs/(?<segment>.*), /${segment}

        - id: restaurant-openapi
          uri: http://${RESTAURANT_SERVICE}
          predicates:
            - Path=/restaurant-docs/**
            - Method=GET
          filters:
            - RewritePath=/restaurant-docs/(?<segment>.*), /${segment}

        - id: menu-openapi
          uri: http://${MENU_SERVICE}
          predicates:
            - Path=/menu-docs/**
            - Method=GET
          filters:
            - RewritePath=/menu-docs/(?<segment>.*), /${segment}

        - id: booking-openapi
          uri: http://${BOOKING_SERVICE}
          predicates:
            - Path=/booking-docs/**
            - Method=GET
          filters:
            - RewritePath=/booking-docs/(?<segment>.*), /${segment}

        - id: order-openapi
          uri: http://${ORDER_SERVICE}
          predicates:
            - Path=/order-docs/**
            - Method=GET
          filters:
            - RewritePath=/order-docs/(?<segment>.*), /${segment}

        - id: payment-openapi
          uri: http://${PAYMENT_SERVICE}
          predicates:
            - Path=/payment-docs/**
            - Method=GET
          filters:
            - RewritePath=/payment-docs/(?<segment>.*), /${segment}

        - id: pos-openapi
          uri: http://${POS_SERVICE}
          predicates:
            - Path=/pos-docs/**
            - Method=GET
          filters:
            - RewritePath=/pos-docs/(?<segment>.*), /${segment}

        - id: review-openapi
          uri: http://${REVIEW_SERVICE}
          predicates:
            - Path=/review-docs/**
            - Method=GET
          filters:
            - RewritePath=/review-docs/(?<segment>.*), /${segment}

        - id: analytics-openapi
          uri: http://${ANALYTICS_SERVICE}
          predicates:
            - Path=/analytics-docs/**
            - Method=GET
          filters:
            - RewritePath=/analytics-docs/(?<segment>.*), /${segment}

        - id: notification-openapi
          uri: http://${NOTIFICATION_SERVICE}
          predicates:
            - Path=/notification-docs/**
            - Method=GET
          filters:
            - RewritePath=/notification-docs/(?<segment>.*), /${segment}

        # ---------- Fallback for unmatched routes ----------
        - id: not-found
          uri: ${GATEWAY_FALLBACK_URI:forward:/404}
          predicates:
            - Path=/**
          filters:
            - name: SetStatus
              args:
                status: 404

    loadbalancer:
      enabled: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    security:
      protocol: ${SPRING_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    properties:
      sasl:
        mechanism: ${SPRING_KAFKA_PROPERTIES_SASL_MECHANISM:SCRAM-SHA-256}
        jaas:
          config: ${SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG:org.apache.kafka.common.security.scram.ScramLoginModule required;}
      spring.json.add.type.headers: true
    consumer:
      group-id: gateway-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"

  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER}
      audience: ${JWT_AUDIENCE}

  threads:
    virtual:
      enabled: true

  aop:
    proxy-target-class: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}

server:
  port: ${SERVER_PORT}
  shutdown: graceful

jwt:
  redis-timeout-ms: 2000

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 30
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 80
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 10s
        recordExceptions:
          # - org.springframework.web.server.ResponseStatusException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
          - java.net.ConnectException
    instances:
      userServiceCircuitBreaker:
        baseConfig: default
      restaurantServiceCircuitBreaker:
        baseConfig: default
      menuServiceCircuitBreaker:
        baseConfig: default
      bookingServiceCircuitBreaker:
        baseConfig: default
      orderServiceCircuitBreaker:
        baseConfig: default
      paymentServiceCircuitBreaker:
        baseConfig: default
      posServiceCircuitBreaker:
        baseConfig: default
      reviewServiceCircuitBreaker:
        baseConfig: default
      analyticsServiceCircuitBreaker:
        baseConfig: default
      notificationServiceCircuitBreaker:
        baseConfig: default

  timelimiter:
    instances:
      userServiceCircuitBreaker:
        timeoutDuration: 60s
        cancelRunningFuture: true
      restaurantServiceCircuitBreaker:
        timeoutDuration: 60s
        cancelRunningFuture: true
      menuServiceCircuitBreaker:
        timeoutDuration: 60s
        cancelRunningFuture: true
      bookingServiceCircuitBreaker:
        timeoutDuration: 60s
        cancelRunningFuture: true
      orderServiceCircuitBreaker:
        timeoutDuration: 60s
        cancelRunningFuture: true
      paymentServiceCircuitBreaker:
        timeoutDuration: 60s
        cancelRunningFuture: true
      posServiceCircuitBreaker:
        timeoutDuration: 60s
        cancelRunningFuture: true
      reviewServiceCircuitBreaker:
        timeoutDuration: 60s
        cancelRunningFuture: true
      analyticsServiceCircuitBreaker:
        timeoutDuration: 60s
        cancelRunningFuture: true
      notificationServiceCircuitBreaker:
        timeoutDuration: 60s
        cancelRunningFuture: true

      #retry:
      # instances:
      #grpc:
      #  maxAttempts: 3
      #  waitDuration: 1s
      #  retryExceptions:
      #    - io.grpc.StatusRuntimeException
      #    - java.util.concurrent.TimeoutException

management:
  endpoints:
    web:
      exposure:
        include: health,readiness,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always   # optional, for debugging
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.tuttime: DEBUG
    org.springframework.cloud.gateway: INFO

graylog:
  host: ${GRAYLOG_HOST}
  port: ${GRAYLOG_PORT}
  origin-host: ${GRAYLOG_ORIGIN_HOST}
  facility: ${GRAYLOG_FACILITY:api-gateway}
  include-source: ${GRAYLOG_INCLUDE_SOURCE:true}
  maximum-message-size: ${GRAYLOG_MAX_MESSAGE_SIZE:8192}
  compression-type: ${GRAYLOG_COMPRESSION_TYPE:GZIP}

bruteforce:
  warning-threshold: ${BRUTEFORCE_WARNING_THRESHOLD}
  ip-block-threshold: ${BRUTEFORCE_IP_BLOCK_THRESHOLD}
  phone-block-threshold: ${BRUTEFORCE_PHONE_BLOCK_THRESHOLD}
  permanent-block-threshold: ${BRUTEFORCE_PERMANENT_BLOCK_THRESHOLD}
  ip-block-duration-minutes: ${BRUTEFORCE_IP_BLOCK_DURATION_MINUTES}
  phone-block-duration-minutes: ${BRUTEFORCE_PHONE_BLOCK_DURATION_MINUTES}
  # On Redis outage: false = fail-closed (reject auth with 503), true = fail-open (bypass check)
  fail-open: ${BRUTEFORCE_FAIL_OPEN:false}

antifraud:
  max-devices-per-user: ${ANTIFRAUD_MAX_DEVICES_PER_USER}
  multi-account-ip-threshold: ${ANTIFRAUD_MULTI_ACCOUNT_IP_THRESHOLD}

rate:
  limit:
    authenticated:
      refill:
        period:
          minutes: 1

springdoc:
  # Aggregated API docs / Swagger UI are exposed UNAUTHENTICATED, so disable in production
  # (set SPRINGDOC_ENABLED=false). Downstream services also @Profile("!production")-guard their docs.
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  cache:
    disabled: true
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html
    config-url: /v3/api-docs
    operations-sorter: alpha
    tags-sorter: alpha
    urls:
      - name: User Service
        url: /user-docs/v3/api-docs
      - name: Restaurant Service
        url: /restaurant-docs/v3/api-docs
      - name: Menu Service
        url: /menu-docs/v3/api-docs
      - name: Booking Service
        url: /booking-docs/v3/api-docs
      - name: Order Service
        url: /order-docs/v3/api-docs
      - name: Payment Service
        url: /payment-docs/v3/api-docs
      - name: Pos Service
        url: /pos-docs/v3/api-docs
      - name: Review Service
        url: /review-docs/v3/api-docs
      - name: Analytics Service
        url: /analytics-docs/v3/api-docs
      - name: Notification Service
        url: /notification-docs/v3/api-docs

  writer-with-default-pretty-printer: true
  use-fqn: true # Uses Fully Qualified Names to prevent collisions



