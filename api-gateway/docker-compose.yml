services:
  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway/docker/Dockerfile
    image: tuttime/api-gateway:v1  # <--- Add this line
    container_name: tuttime-api-gateway
    env_file:
      - .env.docker
    environment:
      # Explicitly set profile to ensure docker profile is active
      SPRING_PROFILES_ACTIVE: docker
      # Redis configuration - explicitly set to ensure they're passed to container
      REDIS_HOST: tuttime-redis
      REDIS_PORT: 6379
      # REDIS_PASSWORD will be loaded from .env via env_file
      # Don't set it here to avoid overriding the value from env_file
      ZIPKIN_URL: http://tuttime-zipkin:9411/api/v2/spans
      HOSTNAME: api-gateway
    ports:
      - "29000:29000"
    networks:
      - tuttime-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:29000/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

networks:
  tuttime-network:
    external: true

