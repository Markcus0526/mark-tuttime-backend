services:
  api-gateway:
    build:
      context: ../
      dockerfile: api-gateway/docker/Dockerfile
    image: tuttime/api-gateway:v1
    container_name: tuttime-api-gateway
    env_file:
      - .env.docker
    environment:
      # Explicitly mapping essential Spring variables to ensure environment consistency
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: ${API_GATEWAY_PORT}
      HOSTNAME: api-gateway
      JAVA_TOOL_OPTIONS: "-XX:InitialRAMPercentage=50.0 -XX:ActiveProcessorCount=2"
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    deploy:
      resources:
        limits:
          cpus: '1.0'          # Max 1 CPU core (Virtual threads handle the rest)
          memory: 1536M        # 1.5GB Hard Limit
        reservations:
          cpus: '0.25'         # Minimum guaranteed
          memory: 1024M        # 1GB Reserved RAM
    healthcheck:
      test: [ "CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/${API_GATEWAY_PORT}" ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - tuttime-network
    restart: always

networks:
  tuttime-network:
    external: true
