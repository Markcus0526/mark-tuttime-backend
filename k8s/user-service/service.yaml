apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: tuttime
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 28001
      targetPort: 28001
    - name: grpc
      port: 29001
      targetPort: 29001
    - name: debug
      port: 5001
      targetPort: 5001
  type: ClusterIP