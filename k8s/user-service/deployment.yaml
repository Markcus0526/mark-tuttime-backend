apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: tuttime
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "28001"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: user-service
          image: tuttime/user-service:v1
          imagePullPolicy: IfNotPresent   # or Never
          ports:
            - containerPort: 28001
              name: http
            - containerPort: 29001
              name: grpc
            - containerPort: 5001
              name: debug
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:ActiveProcessorCount=2 -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=0.0.0.0:5001"
          envFrom:
            - configMapRef:
                name: user-service-config
            - secretRef:
                name: user-service-secrets
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              memory: "1024Mi"
              cpu: "250m"
            limits:
              memory: "1800Mi"
              cpu: "1000m"
          livenessProbe:
            tcpSocket:
              port: 28001
            initialDelaySeconds: 120
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 28001
            initialDelaySeconds: 30
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: user-service-uploads-pvc.yaml