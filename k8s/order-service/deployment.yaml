apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: tuttime
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "28005"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: order-service
          image: tuttime/order-service:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 28005
              name: http
            - containerPort: 29005
              name: grpc
            - containerPort: 5005
              name: debug
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:ActiveProcessorCount=2 -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005"
          envFrom:
            - configMapRef:
                name: order-service-config
            - secretRef:
                name: order-service-secrets
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              memory: "1024Mi"
              cpu: "500m"
            limits:
              memory: "1800Mi"
              cpu: "1000m"
          livenessProbe:
            tcpSocket:
              port: 28005
            initialDelaySeconds: 120
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 28005
            initialDelaySeconds: 30
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: order-service-uploads-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-service-uploads-pvc
  namespace: tuttime
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi