apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: tuttime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "28006"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: payment-service
          image: tuttime/payment-service:v1
          imagePullPolicy: IfNotPresent   # or Never
          ports:
            - containerPort: 28006
              name: http
            - containerPort: 29006
              name: grpc
            - containerPort: 5006
              name: debug
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:ActiveProcessorCount=2 -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5006"
          envFrom:
            - configMapRef:
                name: payment-service-config
            - secretRef:
                name: payment-service-secrets
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              memory: "1024Mi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
              cpu: "750m"
          livenessProbe:
            tcpSocket:
              port: 28006
            initialDelaySeconds: 120
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 28006
            initialDelaySeconds: 30
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: payment-service-uploads-pvc