apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: tuttime
spec:
  replicas: 2   # adjust to 1 if single node
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: api-gateway
          image: tuttime/api-gateway:v1   # change to your registry/image
          imagePullPolicy: IfNotPresent   # or Never
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 5000
              name: debug   # optional, for JDWP
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:InitialRAMPercentage=50.0 -XX:ActiveProcessorCount=2 -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5000"
          envFrom:
            - configMapRef:
                name: api-gateway-config
            - secretRef:
                name: api-gateway-secrets
          resources:
            requests:
              memory: "1024Mi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          # Optional: graceful shutdown
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]