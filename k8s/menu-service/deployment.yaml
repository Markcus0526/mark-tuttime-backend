apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-service
  namespace: tuttime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: menu-service
  template:
    metadata:
      labels:
        app: menu-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "28003"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: menu-service
          image: tuttime/menu-service:v1
          imagePullPolicy: IfNotPresent   # or Never
          ports:
            - containerPort: 28003
              name: http
            - containerPort: 29003
              name: grpc
            - containerPort: 5003
              name: debug
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:ActiveProcessorCount=2 -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5003"
          envFrom:
            - configMapRef:
                name: menu-service-config
            - secretRef:
                name: menu-service-secrets
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              memory: "1536Mi"
              cpu: "500m"
            limits:
              memory: "2048Mi"
              cpu: "1000m"
          livenessProbe:
            tcpSocket:
              port: 28003
            initialDelaySeconds: 120
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 28003
            initialDelaySeconds: 30
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: menu-service-uploads-pvc