apiVersion: v1
kind: Secret
metadata:
  name: graylog-secret
  namespace: tuttime
type: Opaque
data:
  # "***REMOVED***" base64 encoded
  GRAYLOG_PASSWORD_SECRET: ***REMOVED***
  # SHA2 of "admin" -> 8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918
  GRAYLOG_ROOT_PASSWORD_SHA2: ***REMOVED***
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graylog
  namespace: tuttime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graylog
  template:
    metadata:
      labels:
        app: graylog
    spec:
      containers:
        - name: graylog
          image: graylog/graylog:5.2
          ports:
            - containerPort: 9002
            - containerPort: 12201
              protocol: UDP
          env:
            - name: GRAYLOG_PASSWORD_SECRET
              valueFrom:
                secretKeyRef:
                  name: graylog-secret
                  key: GRAYLOG_PASSWORD_SECRET
            - name: GRAYLOG_ROOT_PASSWORD_SHA2
              valueFrom:
                secretKeyRef:
                  name: graylog-secret
                  key: GRAYLOG_ROOT_PASSWORD_SHA2
            - name: GRAYLOG_HTTP_BIND_ADDRESS
              value: "0.0.0.0:9002"
            - name: GRAYLOG_HTTP_EXTERNAL_URI
              value: "http://localhost:9002/"
            - name: GRAYLOG_MONGODB_URI
              value: "mongodb://mongodb:27017/graylog"
            - name: GRAYLOG_ELASTICSEARCH_HOSTS
              value: "http://opensearch:9200"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: graylog
  namespace: tuttime
spec:
  selector:
    app: graylog
  ports:
    - name: web
      port: 9002
      targetPort: 9002
    - name: gelf-udp
      port: 12201
      targetPort: 12201
      protocol: UDP
  type: ClusterIP