apiVersion: apps/v1
kind: Deployment
metadata:
  name: graylog
  namespace: tuttime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graylog
  template:
    metadata:
      labels:
        app: graylog
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: graylog
          image: graylog/graylog:5.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9002
            - containerPort: 12201
              protocol: UDP
          env:
            - name: GRAYLOG_PASSWORD_SECRET
              valueFrom:
                secretKeyRef:
                  name: graylog-secret
                  key: GRAYLOG_PASSWORD_SECRET
            - name: GRAYLOG_ROOT_PASSWORD_SHA2
              valueFrom:
                secretKeyRef:
                  name: graylog-secret
                  key: GRAYLOG_ROOT_PASSWORD_SHA2
            - name: GRAYLOG_HTTP_BIND_ADDRESS
              value: "0.0.0.0:9002"
            - name: GRAYLOG_HTTP_EXTERNAL_URI
              value: "http://localhost:9002/"
            - name: GRAYLOG_MONGODB_URI
              value: "mongodb://mongodb:27017/graylog"
            - name: GRAYLOG_ELASTICSEARCH_HOSTS
              value: "http://opensearch:9200"
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "2Gi"          # was 1Gi – increase to 2Gi
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/system/lbstatus
              port: 9002
            initialDelaySeconds: 300   # was 180 – increase to 5 minutes
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/system/lbstatus
              port: 9002
            initialDelaySeconds: 240   # was 120 – increase to 4 minutes
            periodSeconds: 10
            timeoutSeconds: 5
