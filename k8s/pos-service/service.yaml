apiVersion: v1
kind: Service
metadata:
  name: pos-service
  namespace: tuttime
spec:
  selector:
    app: pos-service
  ports:
    - name: http
      port: 28007
      targetPort: 28007
    - name: grpc
      port: 29007
      targetPort: 29007
    - name: debug
      port: 5007
      targetPort: 5007
  type: ClusterIP