name: TutTime Backend Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build Binaries and Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the codebase into the runner
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Establish a reproducible Java runtime environment
      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # Automatically caches .m2 dependencies to accelerate runs

      # 3. CRITICAL AUDIT RESOLUTION: Run full automated tests suite before compiling images
      - name: Run Maven Automated Tests
        run: mvn clean test

  build-and-push-docker:
    name: Build Reproducible Docker Images
    needs: build-and-test # Blocks execution if automated tests fail above!
    runs-on: ubuntu-latest
    if: github.event_name == 'push' # Only push images to registry on concrete merges

    strategy:
      matrix:
        # Define the exact directory names of the microservices you want to build concurrently
        service: [analytics-service, order-service, booking-service, menu-service, notification-service,
                  user-service, restaurant-service, payment-service, pos-service, review-service]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Compile specific sub-module production binaries inside your mono-repo structure
      - name: Compile Fat JAR Binary
        run: mvn clean package -DskipTests -pl services/${{ matrix.service }} -am

      # Establish isolated Docker build layers
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate securely with your secure external container registry
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the final version-controlled, immutable deployment asset container
      - name: Build and Push Versioned Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/docker/Dockerfile
          push: true
          # Tags the image with the unique Git commit hash for bulletproof tracking
          tags: |
            tuttime/${{ matrix.service }}:latest
            tuttime/${{ matrix.service }}:${{ github.sha }}

  # api-gateway lives outside services/ and has its own Dockerfile path + image name
  build-and-push-gateway:
    name: Build Reproducible API Gateway Image
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile Fat JAR Binary
        run: mvn clean package -DskipTests -pl api-gateway -am

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Versioned Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api-gateway/docker/Dockerfile
          push: true
          tags: |
            tuttime/api-gateway:latest
            tuttime/api-gateway:${{ github.sha }}
