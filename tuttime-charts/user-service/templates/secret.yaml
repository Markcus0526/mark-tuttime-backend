apiVersion: v1
kind: Secret
metadata:
  name: {{ include "user-service.fullname" . }}-secrets
type: Opaque
data:
  DATABASE_USERNAME: {{ .Values.database.user | b64enc }}
  DATABASE_PASSWORD: {{ .Values.database.password | b64enc }}
  JWT_SECRET: {{ .Values.jwt.secret | b64enc }}
  S3_ACCESS_KEY: {{ .Values.s3.accessKey | b64enc }}
  S3_SECRET_KEY: {{ .Values.s3.secretKey | b64enc }}