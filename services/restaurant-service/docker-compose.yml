services:
  restaurant-service-db:
    image: postgis/postgis:15-3.4-alpine
    container_name: tuttime-restaurant-service-db
    ports:
      - "5402:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: restaurant_service_db
    volumes:
      - restaurant_service_db_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - tuttime-network
    restart: always

  restaurant-service:
    build:
      context: ../../
      dockerfile: services/restaurant-service/docker/Dockerfile
    image: tuttime/restaurant-service:v1
    container_name: tuttime-restaurant-service
    depends_on:
      restaurant-service-db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      # Java options (fixed debug agent)
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=2 -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5002"
    ports:
      - "28002:28002"
      - "29002:29002"
      - "5002:5002"
    volumes:
      - ./uploads:/app/uploads:rw
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
        reservations:
          cpus: '0.50'
          memory: 1536M
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/${SERVER_PORT} || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - tuttime-network
    restart: always

volumes:
  restaurant_service_db_data:

networks:
  tuttime-network:
    external: true