spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true

restaurant:
  jwt:
    secret: ***REMOVED***

logging:
  level:
    com.tuttime.restaurant: DEBUG
