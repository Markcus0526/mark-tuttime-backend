services:
  menu-service-db:
    image: postgres:15-alpine
    container_name: tuttime-menu-service-db
    ports:
      - "5403:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: menu_service_db
    volumes:
      - menu_service_db_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d menu_service_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - tuttime-network
    restart: always

  menu-service:
    build:
      context: ../../
      dockerfile: services/menu-service/docker/Dockerfile
    image: tuttime/menu-service:v1
    container_name: tuttime-menu-service
    depends_on:
      menu-service-db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads:rw
    env_file:
      - .env.docker
    environment:
      # Java options (fixed debug agent)
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=2 -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5003"
    ports:
      - "28003:28003"
      - "29003:29003"
      - "5003:5003"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
        reservations:
          cpus: '0.50'
          memory: 1536M
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/${SERVER_PORT} || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - tuttime-network
    restart: always

volumes:
  menu_service_db_data:

networks:
  tuttime-network:
    external: true