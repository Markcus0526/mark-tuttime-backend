services:
  menu-service-db:
    image: postgres:15-alpine
    container_name: tuttime-menu-service-db
    ports:
      - "5403:5432"
    env_file: [.env.docker]
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - menu_service_db_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/02-init-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - tuttime-network
    restart: always

  menu-service:
    build:
      context: ../../
      dockerfile: services/menu-service/docker/Dockerfile
    image: tuttime/menu-service:v1
    container_name: tuttime-menu-service
    depends_on:
      menu-service-db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      # Inject values directly to override anything in application.yml
      SERVER_PORT: ${MENU_SERVICE_PORT}
      HOSTNAME: menu-service
    ports:
      - "${MENU_SERVICE_PORT}:${MENU_SERVICE_PORT}"
      - "${MENU_GRPC_PORT}:${MENU_GRPC_PORT}"
    volumes:
      - ./uploads:/app/uploads:rw # Persistent local storage for menu images
    healthcheck:
      test: [ "CMD-SHELL", "cat < /dev/null > /dev/tcp/127.0.0.1/${MENU_SERVICE_PORT} || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - tuttime-network
    restart: always

volumes:
  menu_service_db_data:

networks:
  tuttime-network:
    external: true

