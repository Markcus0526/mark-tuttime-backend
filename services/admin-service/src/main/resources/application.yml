spring:
  application:
    name: admin-service
  jackson:
    default-property-inclusion: always  # Include null fields in JSON responses
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/admin_service_db?currentSchema=admin_service&stringtype=unspecified&prepareThreshold=0&TimeZone=UTC}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Optimized for 10M user scale - increased pool size for high concurrency
      maximum-pool-size: ${DB_POOL_MAX_SIZE:100}
      minimum-idle: ${DB_POOL_MIN_IDLE:20}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      # Set timezone to UTC on each connection
      connection-init-sql: SET timezone = 'UTC'
      # Performance optimizations
      connection-test-query: SELECT 1
      validation-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true

  # Redis Cache Configuration - Optimized for 10M user scale
  cache:
    type: ${CACHE_TYPE:redis}
    redis:
      time-to-live: 300000 # 5 minutes default TTL
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "admin:cache:"
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB  # Maximum size per file (500MB for videos)
      max-request-size: 500MB  # Maximum size of multipart request
      file-size-threshold: 2KB  # Files larger than this will be written to disk
  data:
    redis:
      # Redis Sentinel Configuration (preferred for HA)
      # If SPRING_DATA_REDIS_SENTINEL_MASTER and SPRING_DATA_REDIS_SENTINEL_NODES are set, Sentinel mode is used
      # Otherwise, direct connection mode is used (backward compatible)
      # Spring Boot automatically maps SPRING_DATA_REDIS_SENTINEL_* environment variables to these properties
      sentinel:
        master: ${SPRING_DATA_REDIS_SENTINEL_MASTER:}
        nodes: ${SPRING_DATA_REDIS_SENTINEL_NODES:}
      # Direct connection configuration (used when Sentinel is not configured)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          # Increased pool size for high concurrency
          max-active: ${REDIS_POOL_MAX_ACTIVE:500}
          max-idle: ${REDIS_POOL_MAX_IDLE:50}
          min-idle: ${REDIS_POOL_MIN_IDLE:10}
          max-wait: 5000ms
        # Ensure writes go to master when using Sentinel
        # MASTER: Read and write from master only (prevents READONLY errors)
        # This is critical for JWT token whitelist/blacklist operations
        read-from: MASTER
    # Spring Data Pagination Configuration
    web:
      pageable:
        default-page-size: 100
        max-page-size: 1000
        page-parameter: page
        size-parameter: size
      # Note: Page serialization mode is configured via @EnableSpringDataWebSupport in WebConfig.java

  liquibase:
    change-log: classpath:liquibase/master-changelog.xml
    enabled: false  # Temporarily disabled - enable after creating database

  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration: ${JWT_EXPIRATION:3600000} # 1 hour default for admin
      issuer: ${JWT_ISSUER:tuttime-admin-backend}
      audience: ${JWT_AUDIENCE:tuttime-admin-panel}

  # Kafka Configuration
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:tuttime-kafka:9093}
    security:
      protocol: ${SPRING_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    properties:
      sasl:
        mechanism: ${SPRING_KAFKA_PROPERTIES_SASL_MECHANISM:}
        jaas:
          config: ${SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG:}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      max-in-flight-requests-per-connection: 5

  # Kubernetes Native Discovery Configuration
  cloud:
    # Kubernetes discovery - enabled only in K8s via env var
    kubernetes:
      discovery:
        enabled: ${SPRING_CLOUD_KUBERNETES_DISCOVERY_ENABLED:false}
        namespaces:
          - ${SPRING_CLOUD_KUBERNETES_DISCOVERY_NAMESPACES:tuttime}
        # Use native Kubernetes discovery (no discovery server URL needed)
        discovery-server-url: ""
      config:
        enabled: ${SPRING_CLOUD_KUBERNETES_CONFIG_ENABLED:false}

server:
  port: 28010
  tomcat:
    max-http-post-size: 500MB  # Increase Tomcat's max POST size for large video uploads
    max-swallow-size: 500MB  # Maximum size of request body that will be swallowed
    # Ensure proper Content-Length handling
    max-connections: 10000
    accept-count: 100
    threads:
      max: 200
      min-spare: 10
  # Disable compression to avoid Content-Length mismatch issues
  compression:
    enabled: false
  # Ensure proper encoding
  encoding:
    charset: UTF-8
    enabled: true
    force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.0}  # Disable tracing by default (set to 1.0 to enable)
  # Shared Zipkin instance for distributed tracing
  # To enable tracing, set ZIPKIN_URL environment variable and TRACING_SAMPLING_PROBABILITY=1.0
  # Note: Setting sampling probability to 0.0 disables tracing and prevents connection attempts to Zipkin
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://tuttime-zipkin:9411/api/v2/spans}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.tuttime: DEBUG
    # Reduce Spring Security logging to INFO to avoid noisy anonymous authentication logs for health checks
    org.springframework.security: INFO
    org.springframework.security.web.authentication.AnonymousAuthenticationFilter: WARN  # Suppress anonymous auth logs
    org.hibernate.SQL: WARN  # Disable SQL query logging
    org.hibernate.type.descriptor.sql.BasicBinder: WARN  # Disable SQL parameter binding logging

# Graylog Configuration
# Note: Graylog logging is enabled via Spring profile 'graylog-enabled'
# To enable: Add 'graylog-enabled' to spring.profiles.active
# Example: SPRING_PROFILES_ACTIVE=local,graylog-enabled
graylog:
  host: ${GRAYLOG_HOST:90.156.157.241} # Graylog server host
  port: ${GRAYLOG_PORT:12203} # Graylog UDP port
  origin-host: ${GRAYLOG_ORIGIN_HOST:${spring.application.name}} # Origin host identifier
  facility: ${GRAYLOG_FACILITY:admin-service} # Facility name for log categorization
  include-source: ${GRAYLOG_INCLUDE_SOURCE:true} # Include source file and line number
  include-mdc: ${GRAYLOG_INCLUDE_MDC:true} # Include Mapped Diagnostic Context fields
  include-marker: ${GRAYLOG_INCLUDE_MARKER:true} # Include log markers
  include-caller-data: ${GRAYLOG_INCLUDE_CALLER_DATA:false} # Include caller data (class, method, line)
  maximum-message-size: ${GRAYLOG_MAX_MESSAGE_SIZE:8192} # Maximum GELF message size in bytes
  compression-type: ${GRAYLOG_COMPRESSION_TYPE:GZIP} # Compression type: GZIP, ZLIB, or NONE

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    filter: true
    displayRequestDuration: true
    showExtensions: true
    showCommonExtensions: true
    defaultModelsExpandDepth: 1
    defaultModelExpandDepth: 1

# Application Configuration
app:
  # CORS Configuration
  # Allows requests from localhost:3000 and network IP addresses (admin panel frontend)
  # Can be overridden via CORS_ALLOWED_ORIGINS environment variable
  # For development, includes common localhost and network IP patterns
  # Add your network IP (e.g., http://192.168.0.124:3000) if accessing from another device
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://192.168.0.124:3000}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:3600}
  # IP Whitelist Configuration (Optional)
  security:
    ip-whitelist:
      enabled: ${IP_WHITELIST_ENABLED:false}
      allowed-ips: ${IP_WHITELIST_ALLOWED_IPS:}
  # S3 Configuration for Video Uploads
  # Required for video file uploads via presigned URLs
  # Set via environment variables: APP_S3_ENDPOINT, APP_S3_REGION, APP_S3_BUCKET, APP_S3_ACCESS_KEY, APP_S3_SECRET_KEY
  s3:
    endpoint: ${APP_S3_ENDPOINT:https://s3.ru-7.storage.selcloud.ru}
    region: ${APP_S3_REGION:ru-7}
    bucket: ${APP_S3_BUCKET:tuttime-storage}
    access-key: ${APP_S3_ACCESS_KEY:}
    secret-key: ${APP_S3_SECRET_KEY:}
    base-url: ${APP_S3_BASE_URL:}  # Optional: CDN or public URL base
    presigned-url-expiration-hours: ${APP_S3_PRESIGNED_URL_EXPIRATION_HOURS:168}  # 7 days (168 hours)

# Service URLs for REST clients
# Uses service name variables (e.g., USER_SERVICE) that can be set per environment:
#   Kubernetes (default): USER_SERVICE=user-service
#   Docker: USER_SERVICE=user-service
#   Local: USER_SERVICE=localhost
services:
  user-service:
    url: http://${USER_SERVICE:user-service}:28001
  #mining-service:
  #  url: http://${MINING_SERVICE:mining-service}:28083
  #social-service:
  #  url: http://${SOCIAL_SERVICE:social-service}:28087
  # TODO: Uncomment when token-service is deployed
  # token-service:
  #   url: http://${TOKEN_SERVICE:token-service}:28082
  # TODO: Uncomment when staking-service is deployed
  # staking-service:
  #   url: http://${STAKING_SERVICE:staking-service}:28084
  #rewards-service:
  #  url: http://${REWARDS_SERVICE:rewards-service}:28085
  #content-service:
  #  url: http://${CONTENT_SERVICE:content-service}:28086
  # TODO: Uncomment when conversion-service is deployed
  # conversion-service:
  #   url: http://${CONVERSION_SERVICE:conversion-service}:28087
  #notification-service:
  #  url: http://${NOTIFICATION_SERVICE:notification-service}:28088

# gRPC Server Configuration
grpc:
  server:
    port: ${GRPC_PORT:29199}
  # Global gRPC client deadline (seconds). Prevents indefinite hangs when remote services
  # are unresponsive. 60s is generous for batch operations under heavy load.
  # Used by GrpcClientDeadlineInterceptor.
  client-deadline-seconds: ${GRPC_CLIENT_DEADLINE_SECONDS:60}
  # gRPC Client Configuration - Per-service client settings
  # Uses service name variables (e.g., USER_SERVICE) that can be set per environment:
  #   Kubernetes (default): USER_SERVICE=user-service
  #   Docker: USER_SERVICE=user-service
  #   Local: USER_SERVICE=localhost
  client:
    user-service:
      address: static://${USER_SERVICE:user-service}:28001
      negotiationType: plaintext
    # mining-service:
    #  address: static://${MINING_SERVICE:mining-service}:29193
    #  negotiationType: plaintext
    # TODO: Uncomment when token-service is deployed
    # token-service:
    #   address: static://${TOKEN_SERVICE:token-service}:29190
    #   negotiationType: plaintext
    # TODO: Uncomment when staking-service is deployed
    # staking-service:
    #   address: static://${STAKING_SERVICE:staking-service}:29194
    #   negotiationType: plaintext
    # rewards-service:
    #  address: static://${REWARDS_SERVICE:rewards-service}:29195
    #  negotiationType: plaintext
    # TODO: Uncomment when conversion-service is deployed
    # conversion-service:
    #   address: static://${CONVERSION_SERVICE:conversion-service}:29197
    #   negotiationType: plaintext
    # content-service:
    #  address: static://${CONTENT_SERVICE:content-service}:29196
    #  negotiationType: plaintext
    #notification-service:
    #  address: static://${NOTIFICATION_SERVICE:notification-service}:29198
    #  negotiationType: plaintext

# Resilience4j Configuration - Circuit breaker and retry
resilience4j:
  circuitbreaker:
    instances:
      grpc:
        registerHealthIndicator: true
        slidingWindowSize: 100
        minimumNumberOfCalls: 10
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2s
  retry:
    instances:
      grpc:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

