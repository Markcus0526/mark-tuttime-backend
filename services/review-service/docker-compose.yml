services:
  review-service-db:
    image: postgres:15-alpine
    container_name: tuttime-review-service-db
    ports:
      - "5408:5432"
    env_file: [.env.docker]
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - review_service_db_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/02-init-schema.sql:ro
    deploy:
      resources:
        limits:
          memory: 512M # DB for reviews is lightweight
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - tuttime-network
    restart: always

  review-service:
    build:
      context: ../../
      dockerfile: services/review-service/docker/Dockerfile
    image: tuttime/review-service:v1
    container_name: tuttime-review-service
    depends_on:
      review-service-db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      # Inject values directly to override anything in application.yml
      SERVER_PORT: ${REVIEW_SERVICE_PORT}
      HOSTNAME: review-service
      # JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=2"
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=2 -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5008"
    ports:
      - "${REVIEW_SERVICE_PORT}:${REVIEW_SERVICE_PORT}"
      - "${REVIEW_GRPC_PORT}:${REVIEW_GRPC_PORT}"
      - "0.0.0.0:5008:5008" # Added debug port mapping
    volumes:
      - ./uploads:/app/uploads:rw # Persistent local storage for review images
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1024M
        reservations:
          cpus: '0.1'
          memory: 512M
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/${REVIEW_SERVICE_PORT} || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - tuttime-network
    restart: always

volumes:
  review_service_db_data:

networks:
  tuttime-network:
    external: true

