services:
  review-service-db:
    image: postgres:15-alpine
    container_name: tuttime-review-service-db
    ports:
      - "5408:5432"
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-${DATABASE_USERNAME:-postgres}}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-review_service_db}
    volumes:
      - review_service_db_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:r
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d review_service_db" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - tuttime-network
    restart: always

  review-service:
    build:
      context: ../..
      dockerfile: services/review-service/docker/Dockerfile
    image: tuttime/review-service:v1  # <--- Add this line
    container_name: tuttime-review-service
    depends_on:
      review-service-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Explicitly set profile to ensure docker profile is active
      # To enable Graylog logging, set SPRING_PROFILES_ACTIVE=docker,graylog-enabled in .env
      # Example: SPRING_PROFILES_ACTIVE=docker,graylog-enabled
      SPRING_PROFILES_ACTIVE: docker
      # Graylog Configuration (optional - only used if graylog-enabled profile is active)
      GRAYLOG_HOST: ${GRAYLOG_HOST:-90.156.157.241}
      GRAYLOG_PORT: ${GRAYLOG_PORT:-12203}
      # Database configuration
      DATABASE_URL: jdbc:postgresql://tuttime-review-service-db:5432/review_service_db?currentSchema=review_service&stringtype=unspecified&prepareThreshold=0&TimeZone=UTC
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      # DATABASE_PASSWORD will be loaded from .env via env_file
      # Redis configuration - explicitly set to ensure they're passed to container
      REDIS_HOST: tuttime-redis
      REDIS_PORT: 6379
      # REDIS_PASSWORD will be loaded from .env via env_file
      # Don't set it here to avoid overriding the value from env_file
      KAFKA_BOOTSTRAP_SERVERS: tuttime-kafka:9093
      ZIPKIN_URL: http://tuttime-zipkin:9411/api/v2/spans
      GRPC_PORT: 29191
      JAVA_OPTS: "-Duser.timezone=UTC -Xms512m -Xmx1024m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -XX:+PrintGCDetails -Xlog:gc:/tmp/gc.log"
    ports:
      - "8001:8001"
      - "29191:29191"
    networks:
      - tuttime-network
    healthcheck:
      # Use liveness endpoint - only checks diskSpace,ping (non-recoverable failures)
      #test: ["CMD-SHELL", "wget --spider --quiet http://localhost:8001/actuator/health/liveness || exit 1"]
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/8001' || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: always

volumes:
  review_service_db_data:

networks:
  tuttime-network:
    name: tuttime-network
    external: true

