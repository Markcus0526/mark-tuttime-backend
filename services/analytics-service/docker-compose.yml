services:
  analytics-service-db:
    image: postgres:15-alpine
    container_name: tuttime-analytics-service-db
    ports:
      - "5409:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: analytics_service_db
    volumes:
      - analytics_service_db_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analytics_service_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - tuttime-network
    restart: always

  analytics-service:
    build:
      context: ../../
      dockerfile: services/analytics-service/docker/Dockerfile
    image: tuttime/analytics-service:v1
    container_name: tuttime-analytics-service
    depends_on:
      analytics-service-db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      # Java options (fixed debug agent)
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=2 -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5009"

    ports:
      - "28009:28009"
      - "29009:29009"
      - "5009:5009"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
        reservations:
          cpus: '0.50'
          memory: 1536M
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/${SERVER_PORT} || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - tuttime-network
    restart: always

volumes:
  analytics_service_db_data:

networks:
  tuttime-network:
    external: true