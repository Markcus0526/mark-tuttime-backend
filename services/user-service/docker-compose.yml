services:
  user-service-db:
    image: postgis/postgis:15-3.4-alpine
    container_name: tuttime-user-service-db
    ports:
      - "5401:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: user_service_db
    volumes:
      - user_service_db_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tuttime-network

  user-service:
    build:
      context: ../../
      dockerfile: services/user-service/docker/Dockerfile
    image: tuttime/user-service:v1
    container_name: tuttime-user-service
    depends_on:
      user-service-db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=2 -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=0.0.0.0:5001"
    volumes:
      - ./uploads:/app/uploads:rw
    ports:
      - "28001:28001"
      - "29001:29001"
      - "5001:5001"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1800M
        reservations:
          cpus: '0.25'
          memory: 1024M
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/${SERVER_PORT} || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - tuttime-network
    restart: always

volumes:
  user_service_db_data:

networks:
  tuttime-network:
    external: true