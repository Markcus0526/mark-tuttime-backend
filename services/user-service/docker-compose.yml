services:
  user-service-db:
    image: postgis/postgis:15-3.4-alpine
    container_name: tuttime-user-service-db
    ports:
      - "5401:5432"
    env_file: [.env.docker]
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - user_service_db_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/02-init-schema.sql:ro
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [tuttime-network]

  user-service:
    build:
      context: ../../
      dockerfile: services/user-service/docker/Dockerfile
    image: tuttime/user-service:v1
    container_name: tuttime-user-service
    depends_on:
      user-service-db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      # Inject values directly to override anything in application.yml
      SERVER_PORT: ${USER_SERVICE_PORT}
      HOSTNAME: user-service
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=2"
    ports:
      - "${USER_SERVICE_PORT}:${USER_SERVICE_PORT}"
      - "${USER_GRPC_PORT}:${USER_GRPC_PORT}"
    volumes:
      - ./uploads:/app/uploads:rw # Persistent local storage for review images
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1800M
        reservations:
          cpus: '0.25'
          memory: 1024M
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/${USER_SERVICE_PORT} || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - tuttime-network
    restart: always

volumes:
  user_service_db_data:

networks:
  tuttime-network:
    external: true
