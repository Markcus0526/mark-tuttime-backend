services:
  booking-service-db:
    image: postgres:15-alpine
    container_name: tuttime-booking-service-db
    ports:
      - "5404:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: booking_service_db
    volumes:
      - booking_service_db_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking_service_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - tuttime-network
    restart: always

  booking-service:
    build:
      context: ../../
      dockerfile: services/booking-service/docker/Dockerfile
    image: tuttime/booking-service:v1
    container_name: tuttime-booking-service
    depends_on:
      booking-service-db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      # Java options (fixed debug agent)
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=2 -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5004"
    ports:
      - "28004:28004"
      - "29004:29004"
      - "5004:5004"
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 1024M
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/${SERVER_PORT} || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - tuttime-network
    restart: always

volumes:
  booking_service_db_data:

networks:
  tuttime-network:
    external: true