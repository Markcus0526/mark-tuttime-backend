services:
  booking-service-db:
    image: postgres:15-alpine
    container_name: tuttime-booking-service-db
    ports:
      - "5404:5432"
    env_file: [.env.docker]
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - booking_service_db_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/02-init-schema.sql:ro
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - tuttime-network
    restart: always

  booking-service:
    build:
      context: ../../
      dockerfile: services/booking-service/docker/Dockerfile
    image: tuttime/booking-service:v1
    container_name: tuttime-booking-service
    depends_on:
      booking-service-db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      # Inject values directly to override anything in application.yml
      SERVER_PORT: ${BOOKING_SERVICE_PORT}
      HOSTNAME: booking-service
      # JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=2"
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=2 -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5004"
    ports:
      - "${BOOKING_SERVICE_PORT}:${BOOKING_SERVICE_PORT}"
      - "${BOOKING_GRPC_PORT}:${BOOKING_GRPC_PORT}"
      - "0.0.0.0:5004:5004" # Added debug port mapping
    volumes:
      - ./uploads:/app/uploads:rw # Persistent local storage for booking images
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 1024M
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/${BOOKING_SERVICE_PORT} || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - tuttime-network
    restart: always

volumes:
  booking_service_db_data:

networks:
  tuttime-network:
    external: true

