services:
  notification-service-db:
    image: postgres:15-alpine
    container_name: tuttime-notification-service-db
    ports:
      - "5410:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: notification_service_db
    volumes:
      - notification_service_db_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_service_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - tuttime-network
    restart: always

  notification-service:
    build:
      context: ../../
      dockerfile: services/notification-service/docker/Dockerfile
    image: tuttime/notification-service:v1
    container_name: tuttime-notification-service
    depends_on:
      notification-service-db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      # Java options (fixed debug agent)
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=2 -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5010"
    ports:
      - "28010:28010"
      - "29010:29010"
      - "5010:5010"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1024M
        reservations:
          cpus: '0.1'
          memory: 512M
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/${SERVER_PORT} || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - tuttime-network
    restart: always

volumes:
  notification_service_db_data:

networks:
  tuttime-network:
    external: true