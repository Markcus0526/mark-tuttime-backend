spring:
  application:
    name: payment-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE}
      minimum-idle: ${DB_POOL_MIN_IDLE}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      initialization-fail-timeout: -1
      connection-init-sql: SET search_path TO payment_service, public; SET timezone = 'UTC';
    replica:
      url: ${DATABASE_URL}
      username: ${DATABASE_USERNAME}
      password: ${DATABASE_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: ${DB_REPLICA_POOL_MAX_SIZE}
        minimum-idle: ${DB_REPLICA_POOL_MIN_IDLE}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        default_schema: payment_service
        # dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
    open-in-view: false

  data:
    web:
      pageable:
        default-page-size: 100
        max-page-size: 1000
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: 8000ms
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE}
          max-idle: ${REDIS_POOL_MAX_IDLE}
          min-idle: ${REDIS_POOL_MIN_IDLE}
          max-wait: -1ms

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    security:
      protocol: ${SPRING_KAFKA_SECURITY_PROTOCOL}
    properties:
      sasl:
        mechanism: ${SPRING_KAFKA_PROPERTIES_SASL_MECHANISM:}
        jaas:
          config: ${SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG:}
      spring.json.add.type.headers: true
    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  servlet:
    multipart:
      enabled: ${SPRING_SERVLET_MULTIPART_ENABLED}
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE}

  threads:
    virtual:
      enabled: true

  # Cloud block moved outside resilience4j
  cloud:
    kubernetes:
      discovery:
        enabled: ${SPRING_CLOUD_KUBERNETES_DISCOVERY_ENABLED}
        namespaces:
          - ${SPRING_CLOUD_KUBERNETES_DISCOVERY_NAMESPACES}
      config:
        enabled: ${SPRING_CLOUD_KUBERNETES_CONFIG_ENABLED}

  aop:
    proxy-target-class: false

server:
  port: ${SERVER_PORT}
  shutdown: graceful

grpc:
  server:
    port: ${GRPC_PORT}
    permit-keep-alive-without-calls: true
  client:
    user-service:
      address: dns:///${USER_GRPC_SERVICE}
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      keep-alive-timeout: 5s
      keep-alive-without-calls: true
    restaurant-service:
      address: dns:///${RESTAURANT_GRPC_SERVICE}
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      keep-alive-timeout: 5s
      keep-alive-without-calls: true
    menu-service:
      address: dns:///${MENU_GRPC_SERVICE}
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      keep-alive-timeout: 5s
      keep-alive-without-calls: true
    booking-service:
      address: dns:///${BOOKING_GRPC_SERVICE}
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      keep-alive-timeout: 5s
      keep-alive-without-calls: true
    order-service:
      address: dns:///${ORDER_GRPC_SERVICE}
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      keep-alive-timeout: 5s
      keep-alive-without-calls: true
    pos-service:
      address: dns:///${POS_GRPC_SERVICE}
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      keep-alive-timeout: 5s
      keep-alive-without-calls: true
    review-service:
      address: dns:///${REVIEW_GRPC_SERVICE}
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      keep-alive-timeout: 5s
      keep-alive-without-calls: true
    analytics-service:
      address: dns:///${ANALYTICS_GRPC_SERVICE}
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      keep-alive-timeout: 5s
      keep-alive-without-calls: true
    notification-service:
      address: dns:///${NOTIFICATION_GRPC_SERVICE}
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      keep-alive-timeout: 5s
      keep-alive-without-calls: true
  security:
    enabled: false
  client-deadline-seconds: ${GRPC_CLIENT_DEADLINE_SECONDS}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      validate-group-membership: false
      show-details: always
      db:
        enabled: true
      group:
        readiness:
          include: db,diskSpace,ping
        liveness:
          include: diskSpace,ping
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[hikari.connections.*]": true
  health:
    grpc:
      enabled: false
    redis:
      enabled: false
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL}
  prometheus:
    metrics:
      export:
        enabled: true

yookassa:
  shop-id: ${YOOKASSA_SHOP_ID}
  secret-key: ${YOOKASSA_SECRET_KEY}

connection:
  pool:
    monitoring:
      enabled: ${CONNECTION_POOL_MONITORING_ENABLED}

springdoc:
  cache:
    disabled: true
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

bruteforce:
  warning-threshold: ${BRUTEFORCE_WARNING_THRESHOLD}
  ip-block-threshold: ${BRUTEFORCE_IP_BLOCK_THRESHOLD}
  phone-block-threshold: ${BRUTEFORCE_PHONE_BLOCK_THRESHOLD}
  permanent-block-threshold: ${BRUTEFORCE_PERMANENT_BLOCK_THRESHOLD}
  ip-block-duration-minutes: ${BRUTEFORCE_IP_BLOCK_DURATION_MINUTES}
  phone-block-duration-minutes: ${BRUTEFORCE_PHONE_BLOCK_DURATION_MINUTES}

antifraud:
  max-devices-per-user: ${ANTIFRAUD_MAX_DEVICES_PER_USER}
  multi-account-ip-threshold: ${ANTIFRAUD_MULTI_ACCOUNT_IP_THRESHOLD}

resilience4j:
  circuitbreaker:
    instances:
      grpc:
        registerHealthIndicator: true
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        recordExceptions:
          - io.grpc.StatusRuntimeException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
          - java.net.ConnectException
  timelimiter:
    instances:
      grpc:
        timeoutDuration: ${CIRCUIT_BREAKER_TIMEOUT:305s} # Ensure this is > GRPC_CLIENT_DEADLINE_SECONDS!
        cancelRunningFuture: true
  retry:
    instances:
      grpc:
        maxAttempts: 10
        waitDuration: 500ms
        retryExceptions:
          - io.grpc.StatusRuntimeException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - java.lang.IllegalArgumentException

logging:
  level:
    root: ${LOG_LEVEL}
    com.tuttime: DEBUG
    org.springframework.security: INFO

graylog:
  host: ${GRAYLOG_HOST}
  port: ${GRAYLOG_PORT}
  origin-host: ${GRAYLOG_ORIGIN_HOST}
  facility: ${GRAYLOG_FACILITY}
  include-source: ${GRAYLOG_INCLUDE_SOURCE}
  include-mdc: ${GRAYLOG_INCLUDE_MDC}
  include-marker: ${GRAYLOG_INCLUDE_MARKER}
  include-caller-data: ${GRAYLOG_INCLUDE_CALLER_DATA}
  maximum-message-size: ${GRAYLOG_MAX_MESSAGE_SIZE}
  compression-type: ${GRAYLOG_COMPRESSION_TYPE}
