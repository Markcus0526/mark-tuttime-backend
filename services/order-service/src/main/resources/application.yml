spring:
  application:
    name: order-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE}
      minimum-idle: ${DB_POOL_MIN_IDLE}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      connection-init-sql: SET search_path TO order_service, public; SET timezone = 'UTC';
    replica:
      url: ${DATABASE_URL}
      username: ${DATABASE_USERNAME}
      password: ${DATABASE_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: ${DB_REPLICA_POOL_MAX_SIZE}
        minimum-idle: ${DB_REPLICA_POOL_MIN_IDLE}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        default_schema: order_service
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true

  data:
    web:
      pageable:
        default-page-size: 100
        max-page-size: 1000
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: 8000ms
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE}
          max-idle: ${REDIS_POOL_MAX_IDLE}
          min-idle: ${REDIS_POOL_MIN_IDLE}
          max-wait: -1ms

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    security:
      protocol: ${SPRING_KAFKA_SECURITY_PROTOCOL}
    properties:
      sasl:
        mechanism: ${SPRING_KAFKA_PROPERTIES_SASL_MECHANISM:}
        jaas:
          config: ${SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG:}
      spring.json.add.type.headers: true
    consumer:
      group-id: order-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  security:
    jwt:
      access-token:
        secret: ${JWT_SECRET}
        expiration: ${JWT_EXPIRATION}
      issuer: ${JWT_ISSUER}
      audience: ${JWT_AUDIENCE}

  servlet:
    multipart:
      enabled: ${SPRING_SERVLET_MULTIPART_ENABLED}
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE}

  threads:
    virtual:
      enabled: true

  # Cloud block moved outside resilience4j
  cloud:
    kubernetes:
      discovery:
        enabled: ${SPRING_CLOUD_KUBERNETES_DISCOVERY_ENABLED}
        namespaces:
          - ${SPRING_CLOUD_KUBERNETES_DISCOVERY_NAMESPACES}
      config:
        enabled: ${SPRING_CLOUD_KUBERNETES_CONFIG_ENABLED}

server:
  port: ${ORDER_SERVICE_PORT}
  shutdown: graceful

grpc:
  server:
    port: ${ORDER_GRPC_PORT}
  client:
    user-service:
      address: static://${USER_SERVICE}:${USER_GRPC_PORT}
      negotiation-type: plaintext
    restaurant-service:
      address: static://${RESTAURANT_SERVICE}:${RESTAURANT_GRPC_PORT}
      negotiation-type: plaintext
    menu-service:
      address: static://${MENU_SERVICE}:${MENU_GRPC_PORT}
      negotiation-type: plaintext
    booking-service:
      address: static://${BOOKING_SERVICE}:${BOOKING_GRPC_PORT}
      negotiation-type: plaintext
    order-service:
      address: static://${ORDER_SERVICE}:${ORDER_GRPC_PORT}
      negotiation-type: plaintext
    payment-service:
      address: static://${PAYMENT_SERVICE}:${PAYMENT_GRPC_PORT}
      negotiation-type: plaintext
    pos-service:
      address: static://${POS_SERVICE}:${POS_GRPC_PORT}
      negotiation-type: plaintext
    review-service:
      address: static://${REVIEW_SERVICE}:${REVIEW_GRPC_PORT}
      negotiation-type: plaintext
    analytics-service:
      address: static://${ANALYTICS_SERVICE}:${ANALYTICS_GRPC_PORT}
      negotiation-type: plaintext
    notification-service:
      address: static://${NOTIFICATION_SERVICE}:${NOTIFICATION_GRPC_PORT}
      negotiation-type: plaintext
  security:
    enabled: false
  client-deadline-seconds: ${GRPC_CLIENT_DEADLINE_SECONDS}

app:
  media:
    storage:
      type: ${MEDIA_STORAGE_TYPE}
    s3:
      endpoint: ${S3_ENDPOINT}
      region: ${S3_REGION}
      bucket: ${S3_BUCKET}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
    local:
      upload-dir: ${LOCAL_STORAGE_PATH}
      upload-url: ${LOCAL_MEDIA_URL_PATH}
    max-size: ${MEDIA_MAX_SIZE:5242880}
    max-dimension: ${MEDIA_MAX_DIMENSION:1024}
    quality: ${MEDIA_QUALITY:0.85}

  oauth:
    google:
      client:
        id: ${GOOGLE_CLIENT_ID}
    apple:
      client:
        id: ${APPLE_CLIENT_ID}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      validate-group-membership: false
      show-details: always
      db:
        enabled: true
      group:
        readiness:
          include: db,diskSpace,ping
        liveness:
          include: diskSpace,ping
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[hikari.connections.*]": true
  health:
    grpc:
      enabled: false
    redis:
      enabled: false
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL}
  prometheus:
    metrics:
      export:
        enabled: true

connection:
  pool:
    monitoring:
      enabled: ${CONNECTION_POOL_MONITORING_ENABLED}

springdoc:
  cache:
    disabled: true
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

bruteforce:
  warning-threshold: ${BRUTEFORCE_WARNING_THRESHOLD}
  ip-block-threshold: ${BRUTEFORCE_IP_BLOCK_THRESHOLD}
  phone-block-threshold: ${BRUTEFORCE_PHONE_BLOCK_THRESHOLD}
  permanent-block-threshold: ${BRUTEFORCE_PERMANENT_BLOCK_THRESHOLD}
  ip-block-duration-minutes: ${BRUTEFORCE_IP_BLOCK_DURATION_MINUTES}
  phone-block-duration-minutes: ${BRUTEFORCE_PHONE_BLOCK_DURATION_MINUTES}

antifraud:
  max-devices-per-user: ${ANTIFRAUD_MAX_DEVICES_PER_USER}
  multi-account-ip-threshold: ${ANTIFRAUD_MULTI_ACCOUNT_IP_THRESHOLD}

resilience4j:
  circuitbreaker:
    instances:
      grpc:
        registerHealthIndicator: true
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 20s
        failureRateThreshold: 65
  retry:
    instances:
      grpc:
        maxAttempts: 5
        waitDuration: 1s

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} : %msg%n"
  level:
    root: ${LOG_LEVEL}
    com.tuttime: DEBUG
    org.springframework.security: INFO

graylog:
  host: ${GRAYLOG_HOST}
  port: ${GRAYLOG_PORT}
  origin-host: ${GRAYLOG_ORIGIN_HOST}
  facility: ${GRAYLOG_FACILITY}
  include-source: ${GRAYLOG_INCLUDE_SOURCE}
  include-mdc: ${GRAYLOG_INCLUDE_MDC}
  include-marker: ${GRAYLOG_INCLUDE_MARKER}
  include-caller-data: ${GRAYLOG_INCLUDE_CALLER_DATA}
  maximum-message-size: ${GRAYLOG_MAX_MESSAGE_SIZE}
  compression-type: ${GRAYLOG_COMPRESSION_TYPE}
