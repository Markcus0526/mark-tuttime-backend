services:
  order-service-db:
    image: postgres:15-alpine
    container_name: tuttime-order-service-db
    ports:
      - "5405:5432"
    env_file: [.env.docker]
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - order_service_db_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/02-init-schema.sql:ro
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - tuttime-network
    restart: always

  order-service:
    build:
      context: ../../
      dockerfile: services/order-service/docker/Dockerfile
    image: tuttime/order-service:v1
    container_name: tuttime-order-service
    depends_on:
      order-service-db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      # Inject values directly to override anything in application.yml
      # JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=2"
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=2 -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
      - "${GRPC_PORT}:${GRPC_PORT}"
      - "5005:5005" # Added debug port mapping
    volumes:
      - ./uploads:/app/uploads:rw # Persistent local storage for order images
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1800M
        reservations:
          cpus: '0.50'
          memory: 1024M
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/${SERVER_PORT} || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - tuttime-network
    restart: always

volumes:
  order_service_db_data:

networks:
  tuttime-network:
    external: true

