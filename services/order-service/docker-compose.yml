services:
  order-service-db:
    image: postgres:15-alpine
    container_name: tuttime-order-service-db
    ports:
      - "5405:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: order_service_db
    volumes:
      - order_service_db_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/02-init-schema.sql:ro
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_service_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - tuttime-network
    restart: always

  order-service:
    build:
      context: ../../
      dockerfile: services/order-service/docker/Dockerfile
    image: tuttime/order-service:v1
    container_name: tuttime-order-service
    depends_on:
      order-service-db:
        condition: service_healthy
    environment:
      # Spring Boot core
      SPRING_PROFILES_ACTIVE: docker,graylog-enabled
      SERVER_PORT: 28005
      GRPC_PORT: 29005

      # Database
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password
      POSTGRES_DB: order_service_db
      DATABASE_URL: jdbc:postgresql://tuttime-order-service-db:5432/order_service_db?currentSchema=order_service&stringtype=unspecified&prepareThreshold=0&TimeZone=UTC
      DB_POOL_MAX_SIZE: 100
      DB_POOL_MIN_IDLE: 20
      DB_REPLICA_POOL_MAX_SIZE: 50
      DB_REPLICA_POOL_MIN_IDLE: 10

      # Redis (disabled)
      SPRING_CACHE_TYPE: none
      MANAGEMENT_HEALTH_REDIS_ENABLED: false
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ""
      SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE: 20
      SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE: 10
      SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE: 2
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,org.springframework.boot.actuate.autoconfigure.data.redis.RedisHealthContributorAutoConfiguration,org.springframework.boot.actuate.autoconfigure.data.redis.RedisReactiveHealthContributorAutoConfiguration

      # Kafka
      KAFKA_ENABLED: true
      SPRING_KAFKA_BOOTSTRAP_SERVERS: tuttime-kafka:9093
      SPRING_KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: ""
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: ""

      # Media storage
      MEDIA_STORAGE_TYPE: local
      LOCAL_STORAGE_PATH: /app/uploads/medias
      LOCAL_MEDIA_URL_PATH: /order-medias/
      MEDIA_MAX_SIZE: 5242880
      MEDIA_MAX_DIMENSION: 1024
      MEDIA_QUALITY: 0.85
      S3_ENDPOINT: https://selcloud.ru
      S3_REGION: ru-7
      S3_BUCKET: tuttime-storage
      S3_ACCESS_KEY: your_key
      S3_SECRET_KEY: your_secret
      S3_BASE_URL: ""
      S3_PRESIGNED_URL_EXPIRATION_HOURS: 24

      # File uploads
      SPRING_SERVLET_MULTIPART_ENABLED: true
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 10MB
      SPRING_SERVLET_MULTIPART_FILE_SIZE_THRESHOLD: 2KB

      # gRPC service discovery – use service names (not container names)
      USER_GRPC_SERVICE: user-service:29001
      RESTAURANT_GRPC_SERVICE: restaurant-service:29002
      MENU_GRPC_SERVICE: menu-service:29003
      BOOKING_GRPC_SERVICE: booking-service:29004
      ORDER_GRPC_SERVICE: order-service:29005
      PAYMENT_GRPC_SERVICE: payment-service:29006
      POS_GRPC_SERVICE: pos-service:29007
      REVIEW_GRPC_SERVICE: review-service:29008
      ANALYTICS_GRPC_SERVICE: analytics-service:29009
      NOTIFICATION_GRPC_SERVICE: notification-service:29010
      GRPC_CLIENT_DEADLINE_SECONDS: 60

      # Timeouts
      CIRCUIT_BREAKER_TIMEOUT: 305s

      # Monitoring & logging
      MANAGEMENT_ENDPOINT_HEALTH_VALIDATE_GROUP_MEMBERSHIP: false
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
      LOG_LEVEL: INFO
      GRAYLOG_HOST: 173.249.29.61
      GRAYLOG_PORT: 12203
      GRAYLOG_ORIGIN_HOST: order-service
      GRAYLOG_FACILITY: order-service
      GRAYLOG_INCLUDE_SOURCE: true
      GRAYLOG_INCLUDE_MDC: true
      GRAYLOG_INCLUDE_MARKER: true
      GRAYLOG_INCLUDE_CALLER_DATA: false
      GRAYLOG_MAX_MESSAGE_SIZE: 8192
      GRAYLOG_COMPRESSION_TYPE: GZIP

      # Security & anti‑fraud
      BRUTEFORCE_WARNING_THRESHOLD: 3
      BRUTEFORCE_IP_BLOCK_THRESHOLD: 5
      BRUTEFORCE_PHONE_BLOCK_THRESHOLD: 10
      BRUTEFORCE_PERMANENT_BLOCK_THRESHOLD: 15
      BRUTEFORCE_IP_BLOCK_DURATION_MINUTES: 15
      BRUTEFORCE_PHONE_BLOCK_DURATION_MINUTES: 60
      ANTIFRAUD_MAX_DEVICES_PER_USER: 3
      ANTIFRAUD_MULTI_ACCOUNT_IP_THRESHOLD: 3

      # Cloud & other
      CONNECTION_POOL_MONITORING_ENABLED: false
      SPRING_CLOUD_KUBERNETES_DISCOVERY_ENABLED: false
      SPRING_CLOUD_KUBERNETES_CONFIG_ENABLED: false

      # Java options (fixed debug agent)
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=2 -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005"

    ports:
      - "28005:28005"
      - "29005:29005"
      - "5005:5005"
    volumes:
      - ./uploads:/app/uploads:rw
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1800M
        reservations:
          cpus: '0.50'
          memory: 1024M
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/${SERVER_PORT} || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - tuttime-network
    restart: always

volumes:
  order_service_db_data:

networks:
  tuttime-network:
    external: true