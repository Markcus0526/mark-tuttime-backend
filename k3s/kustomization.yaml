# Service-to-service mTLS via Linkerd: inject the data-plane proxy into every workload pod.
# Requires the Linkerd control plane to be installed (see docs/MTLS.md). Until then these
# annotations are inert. Strategic-merge so the annotations map is created where absent.
patches:
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: linkerd-inject-all
      spec:
        template:
          metadata:
            annotations:
              linkerd.io/inject: enabled
  - target:
      kind: StatefulSet
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: linkerd-inject-all
      spec:
        template:
          metadata:
            annotations:
              linkerd.io/inject: enabled

