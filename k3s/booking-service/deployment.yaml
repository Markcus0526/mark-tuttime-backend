apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: tuttime
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "28004"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: booking-service
          image: tuttime/booking-service:v1
          imagePullPolicy: IfNotPresent   # or Never
          ports:
            - containerPort: 28004
              name: http
            - containerPort: 29004
              name: grpc
          envFrom:
            - configMapRef:
                name: booking-service-config
            - secretRef:
                name: booking-service-secrets
          resources:
            requests:
              memory: "2048Mi"
              cpu: "200m"
            limits:
              memory: "4196Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 28004
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 28004
            initialDelaySeconds: 45
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]