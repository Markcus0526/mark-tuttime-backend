apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: tuttime
data:
  # ========== Spring Boot Core ==========
  SPRING_PROFILES_ACTIVE: "k3s"
  SERVER_PORT: "28010"
  GRPC_PORT: "29010"

  # ========== Database (PostgreSQL) ==========
  DATABASE_URL: "jdbc:postgresql://notification-service-db:5432/notification_service_db?currentSchema=notification_service&stringtype=unspecified&prepareThreshold=0&TimeZone=UTC"
  DB_POOL_MAX_SIZE: "100"
  DB_POOL_MIN_IDLE: "20"
  DB_REPLICA_POOL_MAX_SIZE: "50"
  DB_REPLICA_POOL_MIN_IDLE: "10"

  # ========== JWT & Cluster internal secret ==========
  JWT_EXPIRATION: "86400000"
  JWT_ISSUER: "tuttime-backend"
  JWT_AUDIENCE: "tuttime-frontend"
  CLUSTER_INTERNAL_SECRET: "***REMOVED***"

  # ========== Redis (disabled via autoconfigure exclude) ==========
  MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
  SPRING_CACHE_TYPE: "redis"
  SPRING_DATA_REDIS_HOST: "redis.tuttime.svc.cluster.local"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: "password"
  SPRING_DATA_REDIS_TIMEOUT: "8000ms"
  SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE: "20"
  SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE: "10"
  SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE: "2"

  # Exclude Redis auto‑configuration – this service does not use Redis
  SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,org.springframework.boot.actuate.autoconfigure.data.redis.RedisHealthContributorAutoConfiguration,org.springframework.boot.actuate.autoconfigure.data.redis.RedisReactiveHealthContributorAutoConfiguration"

  # ========== Kafka ==========
  KAFKA_ENABLED: "true"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka.tuttime.svc.cluster.local:9093"
  SPRING_KAFKA_SECURITY_PROTOCOL: "SASL_PLAINTEXT"

  # ========== gRPC Service Discovery ==========
  USER_GRPC_SERVICE: "user-service.tuttime.svc.cluster.local:29001"
  RESTAURANT_GRPC_SERVICE: "restaurant-service.tuttime.svc.cluster.local:29002"
  MENU_GRPC_SERVICE: "menu-service.tuttime.svc.cluster.local:29003"
  BOOKING_GRPC_SERVICE: "booking-service.tuttime.svc.cluster.local:29004"
  ORDER_GRPC_SERVICE: "order-service.tuttime.svc.cluster.local:29005"
  PAYMENT_GRPC_SERVICE: "payment-service.tuttime.svc.cluster.local:29006"
  POS_GRPC_SERVICE: "pos-service.tuttime.svc.cluster.local:29007"
  REVIEW_GRPC_SERVICE: "review-service.tuttime.svc.cluster.local:29008"
  ANALYTICS_GRPC_SERVICE: "analytics-service.tuttime.svc.cluster.local:29009"
  NOTIFICATION_GRPC_SERVICE: "notification-service.tuttime.svc.cluster.local:29010"
  GRPC_CLIENT_DEADLINE_SECONDS: "60"

  # ========== Resilience & Timeouts ==========
  CIRCUIT_BREAKER_TIMEOUT: "305s"

  # ========== Monitoring & OpenAPI ==========
  MANAGEMENT_ENDPOINT_HEALTH_VALIDATE_GROUP_MEMBERSHIP: "false"
  SWAGGER_API_GATEWAY_URL: "http://api-gateway.tuttime.svc.cluster.local:8080"
  ZIPKIN_URL: "http://zipkin.tuttime.svc.cluster.local:9411/api/v2/spans"
  LOG_LEVEL: "INFO"

  # ========== Graylog (Centralised Logging) ==========
  GRAYLOG_HOST: "graylog.tuttime.svc.cluster.local"
  GRAYLOG_PORT: "12203"
  GRAYLOG_ORIGIN_HOST: "notification-service.tuttime.svc.cluster.local"
  GRAYLOG_FACILITY: "notification-service"
  GRAYLOG_INCLUDE_SOURCE: "true"
  GRAYLOG_INCLUDE_MDC: "true"
  GRAYLOG_INCLUDE_MARKER: "true"
  GRAYLOG_INCLUDE_CALLER_DATA: "false"
  GRAYLOG_MAX_MESSAGE_SIZE: "8192"
  GRAYLOG_COMPRESSION_TYPE: "GZIP"

  # ========== Security & Anti‑Fraud ==========
  BRUTEFORCE_WARNING_THRESHOLD: "3"
  BRUTEFORCE_IP_BLOCK_THRESHOLD: "5"
  BRUTEFORCE_PHONE_BLOCK_THRESHOLD: "10"
  BRUTEFORCE_PERMANENT_BLOCK_THRESHOLD: "15"
  BRUTEFORCE_IP_BLOCK_DURATION_MINUTES: "15"
  BRUTEFORCE_PHONE_BLOCK_DURATION_MINUTES: "60"
  ANTIFRAUD_MAX_DEVICES_PER_USER: "3"
  ANTIFRAUD_MULTI_ACCOUNT_IP_THRESHOLD: "3"

  # ========== Cloud & Kubernetes Discovery ==========
  CONNECTION_POOL_MONITORING_ENABLED: "false"
  SPRING_CLOUD_KUBERNETES_DISCOVERY_ENABLED: "false"
  SPRING_CLOUD_KUBERNETES_CONFIG_ENABLED: "false"

  # ========== Email (SMTP) ==========
  SPRING_MAIL_HOST: "smtp.gmail.com"
  SPRING_MAIL_PORT: "587"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"