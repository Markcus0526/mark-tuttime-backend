# cert-manager ClusterIssuer referenced by ingress-secure.yaml
# (cert-manager.io/cluster-issuer: "letsencrypt-production").
# PREREQUISITE: cert-manager must be installed in the cluster, e.g.:
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # TODO: replace with a real ops contact address before going live.
    email: admin@tuttime.com
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
