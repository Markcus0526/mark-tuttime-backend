apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tuttime-redis
  namespace: tuttime
spec:
  # 🛑 HIGH AVAILABILITY CORE: 3 nodes (1 Master, 2 Replicas) are required for Sentinel Quorums
  replicas: 3
  serviceName: redis-service
  selector:
    matchLabels:
      app: redis-cluster
  template:
    metadata:
      labels:
        app: redis-cluster
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
            - containerPort: 26379
              name: sentinel
          env:
            # 🛑 SECURE PASSWORD RESOLUTION: Ingests secret parameters out of Git range
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: global-infra-secrets
                  key: INFRA_REDIS_PASSWORD
          command:
            - sh
            - -c
            - |
              # Active runtime bootstrap script to dynamically provision Sentinels per node instance
              # In production, using a pre-packaged Bitnami Helm Chart handles this configuration cleanly!
              redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru --requirepass "$REDIS_PASSWORD" --masterauth "$REDIS_PASSWORD"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command: [ "sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG" ]
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            exec:
              command: [ "sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG" ]
            initialDelaySeconds: 10
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
  # 🛑 DATA SEPARATION FIX: Generates unique standalone disks per pod automatically
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
