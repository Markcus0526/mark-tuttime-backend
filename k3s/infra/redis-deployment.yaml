apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: tuttime
spec:
  replicas: 2
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          env:
            - name: REDIS_PASSWORD
              value: "***REMOVED***"
          command:
            - sh
            - -c
            - |
              if [ -n "$REDIS_PASSWORD" ]; then
                redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru --requirepass "$REDIS_PASSWORD"
              else
                redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
              fi
          livenessProbe:
            exec:
              command: [ "sh", "-c", "redis-cli ${REDIS_PASSWORD:+-a \"$REDIS_PASSWORD\"} ping" ]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: [ "sh", "-c", "redis-cli ${REDIS_PASSWORD:+-a \"$REDIS_PASSWORD\"} ping" ]
            initialDelaySeconds: 5
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1"
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
