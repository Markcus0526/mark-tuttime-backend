# Traefik security-headers middleware referenced by ingress-secure.yaml as
# "tuttime-security-headers@kubernetescrd" (namespace "tuttime" + name "security-headers").
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: tuttime
spec:
  headers:
    frameDeny: true
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: "no-referrer"
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true
