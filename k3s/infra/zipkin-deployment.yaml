apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: tuttime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: zipkin
          image: openzipkin/zipkin:2.24.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9411
          env:
            - name: STORAGE_TYPE
              value: mem
          livenessProbe:
            httpGet:
              path: /health
              port: 9411
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9411
            initialDelaySeconds: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
