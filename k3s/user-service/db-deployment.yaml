apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service-db
  namespace: tuttime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service-db
  template:
    metadata:
      labels:
        app: user-service-db
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgis
          image: postgis/postgis:15-3.4-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-service-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "user_service_db"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "user_service_db"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "user_service_db"]
            initialDelaySeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: user-service-db-pvc
        - name: init-script
          configMap:
            name: user-service-db-init