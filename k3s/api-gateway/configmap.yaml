apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: tuttime
data:
  # ========== Spring Boot Core ==========
  SPRING_PROFILES_ACTIVE: "k3s"
  SERVER_PORT: "8080"
  SPRING_CODEC_MAX_IN_MEMORY_SIZE: "500MB"
  GATEWAY_HTTP_KEEP_ALIVE: "3600s"
  GATEWAY_HTTP_CONNECT_TIMEOUT: "60000"
  GATEWAY_HTTP_RESPONSE_TIMEOUT: "30s"
  GATEWAY_POOL_MAX_CONNECTIONS: "5000"
  CIRCUIT_BREAKER_TIMEOUT: "305s"

  # ========== REST Service Discovery ==========
  USER_SERVICE: "user-service.tuttime.svc.cluster.local:28001"
  RESTAURANT_SERVICE: "restaurant-service.tuttime.svc.cluster.local:28002"
  MENU_SERVICE: "menu-service.tuttime.svc.cluster.local:28003"
  BOOKING_SERVICE: "booking-service.tuttime.svc.cluster.local:28004"
  ORDER_SERVICE: "order-service.tuttime.svc.cluster.local:28005"
  PAYMENT_SERVICE: "payment-service.tuttime.svc.cluster.local:28006"
  POS_SERVICE: "pos-service.tuttime.svc.cluster.local:28007"
  REVIEW_SERVICE: "review-service.tuttime.svc.cluster.local:28008"
  ANALYTICS_SERVICE: "analytics-service.tuttime.svc.cluster.local:28009"
  NOTIFICATION_SERVICE: "notification-service.tuttime.svc.cluster.local:28010"

  # ========== gRPC Service Discovery ==========
  USER_GRPC_SERVICE: "user-service.tuttime.svc.cluster.local:29001"
  RESTAURANT_GRPC_SERVICE: "restaurant-service.tuttime.svc.cluster.local:29002"
  MENU_GRPC_SERVICE: "menu-service.tuttime.svc.cluster.local:29003"
  BOOKING_GRPC_SERVICE: "booking-service.tuttime.svc.cluster.local:29004"
  ORDER_GRPC_SERVICE: "order-service.tuttime.svc.cluster.local:29005"
  PAYMENT_GRPC_SERVICE: "payment-service.tuttime.svc.cluster.local:29006"
  POS_GRPC_SERVICE: "pos-service.tuttime.svc.cluster.local:29007"
  REVIEW_GRPC_SERVICE: "review-service.tuttime.svc.cluster.local:29008"
  ANALYTICS_GRPC_SERVICE: "analytics-service.tuttime.svc.cluster.local:29009"
  NOTIFICATION_GRPC_SERVICE: "notification-service.tuttime.svc.cluster.local:29010"
  GRPC_CLIENT_DEADLINE_SECONDS: "60"

  # ========== Redis (Spring Data properties) ==========
  SPRING_CACHE_TYPE: "redis"
  SPRING_DATA_REDIS_HOST: "redis.tuttime.svc.cluster.local"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: "password"
  SPRING_DATA_REDIS_TIMEOUT: "8000ms"
  SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE: "20"
  SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE: "10"
  SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE: "2"

  # ========== Kafka ==========
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka.tuttime.svc.cluster.local:9093"
  SPRING_KAFKA_SECURITY_PROTOCOL: "PLAINTEXT"

  # ========== CORS ==========
  APP_CORS_ALLOWED_ORIGINS: "http://localhost:8080,http://localhost:18080,https://tuttime-web.vercel.app,http://localhost:5173,http://localhost:8081"

  # ========== JWT ==========
  JWT_ISSUER: "tuttime-backend"
  JWT_AUDIENCE: "tuttime-frontend"
  JWT_EXPIRATION: "86400000"
  CLUSTER_INTERNAL_SECRET: "***REMOVED***"

  # ========== Rate Limiting ==========
  RATE_LIMIT_SIGNIN_CAPACITY: "5"
  RATE_LIMIT_SIGNUP_CAPACITY: "3"

  # ========== Monitoring & Tracing ==========
  ZIPKIN_URL: "http://zipkin.tuttime.svc.cluster.local:9411/api/v2/spans"
  LOG_LEVEL: "INFO"

  # ========== Graylog (Centralised Logging) ==========
  GRAYLOG_HOST: "graylog.tuttime.svc.cluster.local"
  GRAYLOG_PORT: "12203"
  GRAYLOG_ORIGIN_HOST: "api-gateway"
  GRAYLOG_FACILITY: "api-gateway"
  GRAYLOG_INCLUDE_SOURCE: "true"
  GRAYLOG_MAX_MESSAGE_SIZE: "8192"
  GRAYLOG_COMPRESSION_TYPE: "GZIP"

  # ========== Kubernetes Discovery ==========
  SPRING_CLOUD_KUBERNETES_DISCOVERY_ENABLED: "false"
  SPRING_CLOUD_KUBERNETES_CONFIG_ENABLED: "false"