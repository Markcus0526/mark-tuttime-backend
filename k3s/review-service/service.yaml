apiVersion: v1
kind: Service
metadata:
  name: review-service
  namespace: tuttime
spec:
  selector:
    app: review-service
  ports:
    - name: http
      port: 28008
      targetPort: 28008
    - name: grpc
      port: 29008
      targetPort: 29008
    - name: debug
      port: 5008
      targetPort: 5008
  type: ClusterIP