apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-service
  namespace: tuttime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restaurant-service
  template:
    metadata:
      labels:
        app: restaurant-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "28002"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: restaurant-service
          image: tuttime/restaurant-service:v1
          imagePullPolicy: IfNotPresent   # or Never
          ports:
            - containerPort: 28002
              name: http
            - containerPort: 29002
              name: grpc
          envFrom:
            - configMapRef:
                name: restaurant-service-config
            - secretRef:
                name: restaurant-service-secrets
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              memory: "2048Mi"
              cpu: "200m"
            limits:
              memory: "4196Mi"
              cpu: "1000m"
          livenessProbe:
            tcpSocket:
              port: 28002
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 28002
            initialDelaySeconds: 45
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: restaurant-service-uploads-pvc