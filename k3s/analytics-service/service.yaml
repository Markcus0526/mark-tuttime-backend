apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: tuttime
spec:
  selector:
    app: analytics-service
  ports:
    - name: http
      port: 28009
      targetPort: 28009
    - name: grpc
      port: 29009
      targetPort: 29009
    - name: debug
      port: 5009
      targetPort: 5009
  type: ClusterIP