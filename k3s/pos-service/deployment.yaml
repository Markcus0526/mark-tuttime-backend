apiVersion: apps/v1
kind: Deployment
metadata:
  name: pos-service
  namespace: tuttime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pos-service
  template:
    metadata:
      labels:
        app: pos-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "28007"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: pos-service
          image: tuttime/pos-service:v1
          imagePullPolicy: IfNotPresent   # or Never
          ports:
            - containerPort: 28007
              name: http
            - containerPort: 29007
              name: grpc
          envFrom:
            - configMapRef:
                name: pos-service-config
            - secretRef:
                name: pos-service-secrets
          resources:
            requests:
              memory: "1024Mi"
              cpu: "200m"
            limits:
              memory: "2048Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 28007
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 28007
            initialDelaySeconds: 45
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]