apiVersion: v1
kind: ConfigMap
metadata:
  name: pos-service-config
  namespace: tuttime
data:
  # ========== Spring Boot Core ==========
  SPRING_PROFILES_ACTIVE: "k3s"
  SERVER_PORT: "28007"
  GRPC_PORT: "29007"

  # ========== Database (PostgreSQL) ==========
  DATABASE_URL: "jdbc:postgresql://pos-service-db:5432/pos_service_db?currentSchema=pos_service&stringtype=unspecified&prepareThreshold=0&TimeZone=UTC"
  DB_POOL_MAX_SIZE: "100"
  DB_POOL_MIN_IDLE: "20"
  DB_REPLICA_POOL_MAX_SIZE: "50"
  DB_REPLICA_POOL_MIN_IDLE: "10"

  # ========== Cluster internal secret ==========
  CLUSTER_INTERNAL_SECRET: "***REMOVED***"

  # ========== Redis Override Flags ==========
  # 🛑 This turns off the shared RedisConfig class beans completely for this service pod!
  SPRING_CACHE_TYPE: "none"

  # ========== Kafka ==========
  KAFKA_ENABLED: "true"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka.tuttime.svc.cluster.local:9093"
  SPRING_KAFKA_SECURITY_PROTOCOL: "SASL_PLAINTEXT"

  # ========== gRPC Service Discovery ==========
  USER_GRPC_SERVICE: "user-service.tuttime.svc.cluster.local:29001"
  RESTAURANT_GRPC_SERVICE: "restaurant-service.tuttime.svc.cluster.local:29002"
  MENU_GRPC_SERVICE: "menu-service.tuttime.svc.cluster.local:29003"
  BOOKING_GRPC_SERVICE: "booking-service.tuttime.svc.cluster.local:29004"
  ORDER_GRPC_SERVICE: "order-service.tuttime.svc.cluster.local:29005"
  PAYMENT_GRPC_SERVICE: "payment-service.tuttime.svc.cluster.local:29006"
  POS_GRPC_SERVICE: "pos-service.tuttime.svc.cluster.local:29007"
  REVIEW_GRPC_SERVICE: "review-service.tuttime.svc.cluster.local:29008"
  ANALYTICS_GRPC_SERVICE: "analytics-service.tuttime.svc.cluster.local:29009"
  NOTIFICATION_GRPC_SERVICE: "notification-service.tuttime.svc.cluster.local:29010"
  GRPC_CLIENT_DEADLINE_SECONDS: "60"

  # ========== Resilience & Timeouts ==========
  CIRCUIT_BREAKER_TIMEOUT: "305s"

  # ========== Monitoring & OpenAPI ==========
  MANAGEMENT_ENDPOINT_HEALTH_VALIDATE_GROUP_MEMBERSHIP: "false"
  SWAGGER_API_GATEWAY_URL: "http://api-gateway.tuttime.svc.cluster.local:8080"
  ZIPKIN_URL: "http://zipkin.tuttime.svc.cluster.local:9411/api/v2/spans"
  LOG_LEVEL: "INFO"

  # ========== Graylog (Centralised Logging) ==========
  GRAYLOG_HOST: "graylog.tuttime.svc.cluster.local"
  GRAYLOG_PORT: "12203"
  GRAYLOG_ORIGIN_HOST: "pos-service.tuttime.svc.cluster.local"
  GRAYLOG_FACILITY: "pos-service"
  GRAYLOG_INCLUDE_SOURCE: "true"
  GRAYLOG_INCLUDE_MDC: "true"
  GRAYLOG_INCLUDE_MARKER: "true"
  GRAYLOG_INCLUDE_CALLER_DATA: "false"
  GRAYLOG_MAX_MESSAGE_SIZE: "8192"
  GRAYLOG_COMPRESSION_TYPE: "GZIP"

  # ========== Cloud & Kubernetes Discovery ==========
  CONNECTION_POOL_MONITORING_ENABLED: "false"
  SPRING_CLOUD_KUBERNETES_DISCOVERY_ENABLED: "false"
  SPRING_CLOUD_KUBERNETES_CONFIG_ENABLED: "false"