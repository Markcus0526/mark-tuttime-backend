# k3s bundles Traefik as its ingress controller. This HelmChartConfig customises it.
#
# NOTE: This is a k3s bootstrap resource — it is NOT applied via `kubectl apply`/kustomize.
# Copy it onto each k3s server node so the bundled Traefik picks it up:
#
#   sudo cp traefik-config.yaml /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
#
# It must NOT be listed in kustomization.yaml.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        port: 8000
        exposedPort: 80
        # Redirect all plain HTTP to HTTPS at the edge
        redirectTo:
          port: websecure
      websecure:
        port: 8443
        exposedPort: 443
        tls:
          enabled: true
