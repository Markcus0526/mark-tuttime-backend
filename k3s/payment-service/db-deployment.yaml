apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service-db
  namespace: tuttime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service-db
  template:
    metadata:
      labels:
        app: payment-service-db
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-service-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "payment_service_db"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "payment_service_db"]
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "payment_service_db"]
            initialDelaySeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: payment-service-db-pvc
        - name: init-script
          configMap:
            name: payment-service-db-init